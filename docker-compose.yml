# SAI Accounting — fronted by Traefik (same convention as movin-partner /
# wedding-movin). Traefik terminates TLS and routes ${APP_DOMAIN} to
# app-customer and ${OPERATOR_DOMAIN} to app-operator over the shared external
# `traefik` network; neither app is published on the host directly. PostgreSQL
# (`pg`, via `pgbouncer`) + one-shot Prisma migrations run on a private network.
# MariaDB (`db`) was retired in #636 (22 Oct 2026); its volume
# `sai-accounting_db_data` is no longer declared here and stays on disk until
# removed by hand (PRODUCTION.md §MariaDB retired).
#
# Images are built by CI and pulled from GHCR; never build on the server.
# Release steps: PRODUCTION.md §Updates.
#
# `.env` is auto-loaded by Compose for the ${...} interpolation below. It is
# NOT injected wholesale any more: each service receives only the variables it
# names under `environment:` (allowlist, see `x-env` below). Requires an
# existing Traefik instance attached to the external `traefik_default` network
# with a `le` cert resolver.

# ══ DAFTAR IZIN ENV — TIDAK ADA LAGI `env_file: .env` ═══════════════════════
#
# Sampai Okt 2026 SETIAP container menerima seluruh `.env`. Akibatnya
# `app-customer` — satu-satunya proses yang menghadap internet tanpa daftar IP —
# memegang `OPERATOR_SESSION_SECRET` (memalsukan sesi konsol operator),
# `BACKUP_ENCRYPTION_KEY` + kredensial S3 (membuka dan menghapus setiap
# cadangan), dan sandi superuser PostgreSQL. Satu RCE di sana = seluruh rumah.
#
# Sekarang setiap layanan MENYEBUT variabel yang dibacanya. Baris tanpa nilai
# (`AUTH_SECRET:`) mengambil nilainya dari `.env` lewat Compose, dan variabel
# yang tidak ada di `.env` TIDAK diset di container (bukan string kosong) —
# perilakunya identik dengan `env_file` untuk nama yang disebut.
#
# Daftarnya TIDAK ditebak. `bun run env:inventory` menelusuri graf impor dari
# titik masuk tiap layanan dan mencetak setiap env yang dibaca kodenya;
# `tests/compose-env-allowlist.test.ts` MENOLAK compose yang tidak menyediakan
# salah satunya, dan menolak rahasia yang sampai ke layanan yang salah.
#
# ⚠ VARIABEL BARU DI `.env` TIDAK OTOMATIS SAMPAI KE MANA PUN. Itu memang
#   intinya. Kode baru yang membaca env baru → tes merah sampai namanya
#   ditambahkan di layanan (atau grup di bawah) yang membacanya.
#
# Grup bersama ditulis sebagai anchor YAML dan digabung dengan `<<:` — satu
# daftar per kelompok kebutuhan, supaya "sampai ke satu layanan, terlewat di
# yang lain" tidak bisa terjadi untuk variabel yang sama.
x-env:
  # Setiap layanan Node yang membuka buku PT, registry, atau basis data platform.
  books: &env-books
    DATABASE_URL:
    CONTROL_DATABASE_URL:
    PLATFORM_DATABASE_URL:
    COMPANY_DATABASE_URL_TEMPLATE:
    COMPANY_DATABASE_READ_URL_TEMPLATE:
    COMPANY_DATABASE_READ_MAX_WAIT_MS:
    DB_CONNECTION_LIMIT:
    COMPANY_CLIENT_POOL_MAX:
    # Plafon `ensureCompanyClientCapacity` (relay outbox menaikkan kolam ke jumlah buku); bawaan 32.
    COMPANY_CLIENT_POOL_CEILING:
    CONTROL_DB_CONNECTION_LIMIT:
    PLATFORM_DB_CONNECTION_LIMIT:
    POOL_DISCONNECT_GRACE_MS:
    TZ:
    # Profil penyebaran dan URL Redis SENGAJA tidak di sini: yang pertama
    # dinyatakan override on-premise, yang kedua override replika — compose
    # dasar (produksi SaaS satu-replika) tidak menyatakan keduanya.
  # ══ INSTANS BASIS DATA TAMBAHAN (tahap 4) — SATU-SATUNYA TEMPATNYA ═══════
  # `db_instances.url_env_var` menyebut NAMA env (`COMPANY_<KUNCI>_DATABASE_URL_TEMPLATE`)
  # dan nilainya dibaca dari environment proses. Instans baru = satu baris di
  # `.env` DAN satu baris di sini (tanpa nilai), lalu `up -d` ulang semua
  # layanan pembuka buku. Grup ini digabung ke SETIAP layanan yang membuka
  # buku — `tests/db-instance-env-reaches-every-service.test.ts` menjaganya —
  # jadi satu baris di sini sampai ke semuanya sekaligus.
  #
  # ⚠ Sebelum gelar pertama berkas ini: `grep -E '^COMPANY_[A-Z0-9_]+_DATABASE_URL_TEMPLATE=' .env`
  #   — setiap nama yang muncul WAJIB ditulis di sini, atau buku PT di instans
  #   itu berhenti terbuka (PRODUCTION.md §Env allowlist).
  db-instances: &env-db-instances {}
  # Surel keluar (SMTP env atau `mail_settings` tersandi) + alamat alarm.
  mail: &env-mail
    MAIL_TRANSPORT:
    SMTP_URL:
    MAIL_FROM:
    MAIL_ARCHIVE_BCC:
    MAIL_OUTBOX_DIR:
    MAIL_SETTINGS_CACHE_MS:
    SETTINGS_ENCRYPTION_KEY:
    PLATFORM_ALERT_EMAIL:
    PLATFORM_CONTACT_EMAIL:
    PLATFORM_CONTACT_WHATSAPP:
  # Penagihan platform & gerbang pembayaran.
  billing: &env-billing
    PAYMENT_GATEWAY:
    MIDTRANS_SERVER_KEY:
    MIDTRANS_IS_PRODUCTION:
    MANUAL_PAYMENT_INSTRUCTIONS:
    PAYMENT_DEFAULT_VA_BANK:
    PLATFORM_PPN_DISABLED:
    PLATFORM_SELLER_NPWP:
    PLATFORM_SELLER_NAME:
    SELF_SERVE_SIGNUP:
  # ⚠ RAHASIA CADANGAN — hanya `svc-integrator` (jalur `tenant`) dan perkakas
  # `job-backup`. Ditolak di layanan lain oleh penjaga.
  backup: &env-backup
    BACKUP_ENCRYPTION_KEY:
    BACKUP_S3_BUCKET:
    BACKUP_S3_ENDPOINT:
    BACKUP_S3_PREFIX:
    BACKUP_S3_PATH_STYLE:
    BACKUP_LOCAL_DIR:
    BACKUP_RETENTION_DAYS:
    BACKUP_PREFIX:
    BACKUP_WORK_DIR:
    BACKUP_DATA_DIR:
    AWS_ACCESS_KEY_ID:
    AWS_SECRET_ACCESS_KEY:
    AWS_DEFAULT_REGION:
    AWS_REGION:

services:
  # ══ PostgreSQL — MESIN UTAMA sejak 15 Okt 2026 ═════════════════════════════
  #
  # Keduanya kini service BAWAAN — `profiles:` dicabut 15 Okt 2026 saat
  # PostgreSQL menjadi mesin kanonik. Skema Prisma memakai
  # `provider = "postgresql"`, jadi klien yang dibangkitkan hanya bisa bicara ke
  # mesin ini; menjadikannya opsional berarti aplikasi yang naik tanpa basis
  # data sama sekali.
  #
  # `db` (MariaDB) hidup sebagai jalan mundur selama jendela transisi 15–22 Okt
  # 2026 dan DICABUT di Fase E (#636). Jalan mundur ke sana kini hanya lewat
  # dump terakhirnya + image `sha-c9b5d9c` (v0.12.0) — bukan menukar URL. Lihat
  # docs/arsitektur/07-RIWAYAT.md
  pg:
    # ⚠ Versi mayor di sini HARUS sejajar dengan `postgresql-client-17` di
    # `Dockerfile` tahap `backup`. `pg_dump` menolak server yang lebih baru
    # daripada dirinya — terukur: klien 15 menolak server 17.11 dengan
    # "aborting because of server version mismatch". Dijaga
    # `tests/pg-client-version.test.ts`.
    image: postgres:17-alpine
    container_name: sai-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-sai}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: postgres
      TZ: ${TZ:-Asia/Jakarta}
      # `--data-checksums` TIDAK bisa dinyalakan setelah inisialisasi. Satu-satunya
      # kesempatan memasangnya adalah sekarang, dan tanpa itu kerusakan halaman
      # cakram terbaca sebagai data yang sah.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sai} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  # ══ PgBouncer — WAJIB, bukan penyetelan ═══════════════════════════════════
  #
  # MariaDB dulu memakai THREAD per koneksi; PostgreSQL memakai PROSES. Puncak
  # koneksi di kotak ini TERUKUR 62 (`MAX_USED_CONNECTIONS`, masa MariaDB), dan
  # 62 proses backend pada mesin yang dibagi lima aplikasi lain (3,6 GB saat
  # diukur; kini 8 GB) bukan
  # hal sepele.
  #
  # Dan pola klien per-perusahaan memperbesarnya: jumlah koneksi tumbuh mengikuti
  # jumlah BUKU yang aktif bersamaan, bukan jumlah pengguna.
  #
  # `transaction` pooling, bukan `session`: dengan `session` satu koneksi aplikasi
  # memegang satu backend selama hidupnya, dan seluruh manfaatnya hilang.
  # ⚠ Konsekuensinya nyata — `transaction` mode TIDAK mendukung pernyataan
  # bersiap lintas-transaksi. Prisma 7 memakai driver adapter, jadi ini aman,
  # TETAPI menukar mode ke `session` kelak akan mengembalikan soal memori yang
  # justru hendak dipecahkan di sini.
  pgbouncer:
    # VERSI DIPATOK, bukan `latest` (celah on-premise #8). `latest` bergerak
    # tanpa pemberitahuan — dan digest-nya bahkan tidak sama dengan versi
    # bertag mana pun, jadi pemasangan yang menariknya menjalankan pooler yang
    # tidak bisa disebut namanya. Menaikkannya adalah langkah sadar satu baris.
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: sai-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_USER: ${PG_USER:-sai}
      DB_PASSWORD: ${PG_PASSWORD:-}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-migrate
    # ══ MIGRATE MENYAMBUNG LANGSUNG KE `pg`, MELEWATI PgBouncer ═════════════
    #
    # Bukan pilihan gaya — Prisma Migrate memakai `pg_advisory_lock` untuk
    # memastikan hanya satu proses memigrasikan satu basis data pada satu saat.
    # Advisory lock terikat SESI, sedangkan PgBouncer `transaction` pooling
    # memberi backend yang BERBEDA tiap transaksi. Jadi kunci diambil di satu
    # backend lalu dilepas bersama transaksinya, dan percobaan berikutnya
    # menunggu kunci yang tidak pernah ada pemiliknya:
    #
    #   Error: P1002 — Timed out trying to acquire a postgres advisory lock
    #   (SELECT pg_advisory_lock(72707369)). Timeout: 10000ms.
    #
    # Terukur di penukaran 15 Okt 2026. Baris eksplisit di bawah MENIMPA grup
    # `*env-books` (kunci eksplisit menang atas `<<:`), jadi URL-URL ini
    # mengalahkan URL PgBouncer di `.env` — dan HANYA untuk service ini.
    # Aplikasi tetap lewat PgBouncer, yang memang alasan PgBouncer ada.
    #
    # `DATABASE_URL` juga menjadi TEMPLATE untuk 17 buku PT
    # (`migrate-all-companies.ts` mengganti nama basis datanya), jadi satu baris
    # ini membuat seluruh buku ikut dimigrasikan lewat koneksi langsung.
    #
    # ══ PERAN PEMILIK, BUKAN SUPERUSER (hak minimum, Okt 2026) ═══════════════
    # `PG_OWNER_USER` = pemilik seluruh basis data & objek aplikasi (`sai_owner`,
    # NOSUPERUSER CREATEDB) — peran yang boleh DDL. Sebelum peralihan
    # (`bun run db:roles:apply`, PRODUCTION.md §Least-privilege) variabelnya
    # belum ada di `.env` dan baris ini jatuh ke superuser `PG_USER` — persis
    # perilaku lama, jadi berkas ini aman digelar SEBELUM perannya dibuat.
    #
    # Perkakas di container ini (`bootstrap`, `create-company`, …) ikut memakai
    # URL yang sama — dan karena itu pula `PROVISION_DATABASE_URL` serta template
    # buku ditimpa: perkakas yang MEMBUAT basis data harus melakukannya sebagai
    # pemilik, bukan sebagai peran aplikasi dari `.env`.
    environment:
      <<: [*env-books, *env-db-instances, *env-mail, *env-billing]
      DATABASE_URL: postgres://${PG_OWNER_USER:-${PG_USER:-sai}}:${PG_OWNER_PASSWORD:-${PG_PASSWORD}}@pg:5432/${DB_NAME:-sai_production}
      CONTROL_DATABASE_URL: postgres://${PG_OWNER_USER:-${PG_USER:-sai}}:${PG_OWNER_PASSWORD:-${PG_PASSWORD}}@pg:5432/sai_control
      PLATFORM_DATABASE_URL: postgres://${PG_OWNER_USER:-${PG_USER:-sai}}:${PG_OWNER_PASSWORD:-${PG_PASSWORD}}@pg:5432/sai_platform
      COMPANY_DATABASE_URL_TEMPLATE: postgres://${PG_OWNER_USER:-${PG_USER:-sai}}:${PG_OWNER_PASSWORD:-${PG_PASSWORD}}@pg:5432/template
      PROVISION_DATABASE_URL: postgres://${PG_OWNER_USER:-${PG_USER:-sai}}:${PG_OWNER_PASSWORD:-${PG_PASSWORD}}@pg:5432/sai_control
      # Peran aplikasi yang DIHIBAHI hak atas buku yang dibuat perkakas di sini
      # (`create-company`, `tenant:import-onprem`). Kosong = tidak ada hibah —
      # sebelum peralihan, ketika pemilik dan aplikasi masih satu peran.
      PG_APP_USER:
      COMPANY_MIGRATE_CONCURRENCY:
      LICENCE_FILE:
      TENANT_AUDIT_DIR:
    restart: "no"
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - internal

  # ══ `svc-worker` — EMPAT PERAN LATAR NODE, SATU CONTAINER ══════════════════
  #
  # Keputusan pemilik 22 Okt 2026: **1 image = 1 container**. Image `-migrator`
  # dulu menjalankan EMPAT container — `job-scheduler`, `job-conformance`,
  # `svc-ledger`, `svc-interactive` — dan kini satu, dengan empat PROSES di
  # bawah penyelia kecil `scripts/run-workers.ts` (tanpa dependensi, tanpa
  # supervisord). Harga dan alasannya: docs/arsitektur/09-RANCANGAN-LAYANAN.md
  # §3.2.
  #
  # `svc-`, bukan `job-`: container ini BERJALAN TERUS. Dua perannya memang
  # putaran (penjadwal per jam, kesesuaian mingguan), tapi container-nya tidak
  # pernah berakhir.
  #
  # ⚠ GELAR PERTAMA WAJIB `docker compose up -d --remove-orphans`. Tanpanya
  # empat container lama tetap hidup di samping yang baru dan MENGKLAIM
  # pekerjaan yang sama — dua penjadwal, dua pelari `interactive`. Pagar jalur
  # `ledger` menahan yang terburuk, tapi tidak yang lain. PRODUCTION.md §Updates.
  #
  # ══ SATU PERAN MATI = CONTAINER MATI, DAN ITU DISENGAJA ═══════════════════
  # Penyelia keluar BUKAN-NOL begitu satu peran berakhir (apa pun kodenya),
  # sesudah menghentikan tiga lainnya. `restart: unless-stopped` lalu
  # menghidupkan ulang keempatnya utuh. Kebalikannya — container yang tetap
  # "Up" dengan satu peran yang sudah mati — adalah kegagalan paling senyap
  # yang bisa dibuat penyatuan ini: pelari `ledger` yang mati sejak kemarin
  # tidak merusak satu halaman pun.
  #
  # Setiap baris log berawalan nama perannya (`scheduler   | …`), jadi
  # `docker compose logs svc-worker` tetap terbaca, dan satu peran bisa
  # disaring: `docker compose logs svc-worker | grep ' scheduler *|'`.
  #
  # `init: true`: penyelia di belakang tini. Ia tidak memanen proses yatim, dan
  # tini yang membuat kematian penyelia menghentikan seluruh pohon proses.
  #
  # ── PERAN `scheduler` — PENJADWAL LANGGANAN (issue #373) ──────────────────
  # Trial berakhir, tagihan terbit, dunning, suspensi, pengingat H-7/H-3/H-1.
  #
  # ⚠ KENAPA LAYANAN, BUKAN CRON HOST. Sampai #373 ini sebaris crontab yang
  # dipasang tangan — dan TIDAK ADA APA PUN yang memeriksa baris itu ada. Kalau
  # ia terlewat saat rilis, atau hilang karena server dibangun ulang, yang
  # terjadi adalah: uji coba tidak pernah berakhir, tagihan pertama tidak pernah
  # terbit, penunggak tidak pernah ditangguhkan — SEMUANYA tanpa satu pun galat,
  # tanpa halaman rusak, tanpa log merah. Terlihat persis seperti sistem sehat,
  # sampai seseorang membuka laporan pendapatan dan bertanya kenapa nol.
  #
  # Sebagai layanan ia LAHIR BERSAMA DEPLOY: tidak ada langkah manual yang bisa
  # terlewat, dan `docker compose ps` memperlihatkan keberadaannya.
  #
  # Image `migrator` dipakai ulang — env & node_modules yang sama, dan
  # satu-satunya cara menjangkau service `db` yang tidak memublikasikan port
  # (alasan yang sama dengan migration; docs/MULTI-COMPANY.md §3).
  #
  # Langkah yang gagal DITELAN dengan sengaja: satu putaran yang gagal TIDAK
  # BOLEH mematikan putaran-putaran berikutnya. Skripnya idempoten, jadi
  # putaran berikutnya menyembuhkan yang tertinggal — sedangkan loop yang mati
  # karena satu galat mengembalikan kita persis ke kegagalan senyap yang
  # layanan ini tutup (dan sejak penyatuan juga menjatuhkan tiga peran lain).
  # Kegagalannya tetap terbaca: tercatat di `scheduler_runs` (status `error`),
  # tampil di konsol `/scheduler`, dan terbaca `prove-scheduler-alive`.
  #
  # Tidur 3600 detik, BUKAN cron di dalam container: satu proses shell yang
  # tidur tidak memakan apa pun, dan menambah daemon cron ke image berarti satu
  # hal lagi yang bisa mati diam-diam di kotak yang sudah padat.
  #
  # ── PERAN `conformance` — PEMERIKSA KESESUAIAN DATA (mingguan) ───────────
  # Penjaga zod hanya berlaku di jalur TULIS. Impor sekali-jalan, perbaikan SQL
  # manual, dan penyemai tidak melewati satu penjaga pun — dan audit 20-21
  # Agustus 2026 menemukan ENAM kelas cacat yang masuk lewat pintu itu di buku
  # produksi: status kontrak di luar enum, mata uang `LC`, 609 kontrak valas
  # tanpa kurs, 720 pembayaran salah label mata uang, faktur kelebihan bayar,
  # dan kuantitas faktur yang termigrasi salah senilai Rp 774 juta.
  #
  # Semuanya ditemukan dengan menggali manual selama dua hari. Peran ini ada
  # supaya penggalian itu tidak perlu terulang.
  #
  # MINGGUAN, bukan sejam sekali seperti `scheduler`: yang dicarinya bergeser
  # lambat. Cacat seperti ini lahir dari peristiwa jarang — impor sistem lama,
  # perbaikan tangan — bukan dari lalu lintas harian. Memeriksanya tiap jam
  # hanya memindahkan beban tanpa menemukan apa pun lebih cepat.
  #
  # PERAN SENDIRI, bukan langkah di putaran `scheduler`: cadensinya berbeda, dan
  # yang lebih penting — kegagalan penagihan dan temuan kesesuaian data adalah
  # dua kabar berbeda yang tidak boleh bercampur di satu aliran log (awalan
  # peran yang memisahkannya sejak penyatuan).
  #
  # Kode keluarnya DITELAN dengan alasan yang sama seperti tetangganya: skrip
  # ini SENGAJA keluar bukan-nol saat menemukan sesuatu (supaya berguna di CI),
  # dan tanpa penelan itu setiap temuan akan mengakhiri perannya — yang kini
  # berarti seluruh container mati lalu dihidupkan ulang tanpa henti: temuan
  # berubah jadi crash-loop empat peran.
  #
  # Membacanya ADA DUA:
  #   • `docker compose logs svc-worker --tail 200 | grep ' conformance *|'` —
  #     rincian lengkapnya;
  #   • `/api/health` → `conformance` — PUTUSAN denyutnya (ok | findings | late
  #     | unknown) beserta jumlah temuan terakhir, dari tabel `conformance_runs`
  #     (migration platform 0018).
  #
  # Yang kedua ada karena yang pertama saja sudah terbukti tidak cukup: pada
  # cadensi MINGGUAN, temuan yang hanya hidup di log container bisa berumur
  # berbulan-bulan sebelum ada yang membukanya.
  #
  # Putaran pertama jalan SAAT container naik, bukan tujuh hari kemudian,
  # sehingga rilis yang merusak data ketahuan di hari yang sama.
  #
  # Ia tidak mengubah satu angka akuntansi pun: buku PT hanya DIBACA, dan
  # satu-satunya tulisannya adalah satu baris jejak ke basis data PLATFORM.
  # Dijaga `tests/check-data-conformance.test.ts`.
  #
  # ── PERAN `ledger` — SATU-SATUNYA PENULIS BUKU BESAR DI LATAR ────────────
  #
  # ══ KENAPA PERAN TERSENDIRI, BUKAN SATU LANGKAH LAGI DI PUTARAN `scheduler`
  #
  # Karena justru ITU yang dibongkar (rancangan §4). `recurring:run` dulu satu
  # langkah di putaran penjadwal, dan bentuk itu punya tiga cacat yang tidak
  # kelihatan sampai salah satunya kejadian:
  #
  #   • satu PT yang gagal menunggu SEJAM untuk dicoba lagi, karena yang
  #     diulang adalah seluruh putaran — bukan yang gagal;
  #   • langkah itu memikul batas `timeout` putaran, dan batas itu harus
  #     diturunkan setiap kali ada langkah baru. Memposting dokumen berulang
  #     untuk SEMUA PT di bawah satu stopwatch yang menyusut adalah ongkos yang
  #     tumbuh seiring jumlah pelanggan;
  #   • putaran yang mati di tengah daftar meninggalkan separuh PT tak tergarap
  #     tanpa satu baris pun yang mencatat sampai mana ia sempat.
  #
  # Sekarang penjadwal MENERBITKAN (satu baris `jobs` per PT, selesai dalam
  # milidetik) dan peran ini MELAKSANAKAN, dengan `attempts` dan backoff per
  # PT. Itu sekaligus menutup P2-2: tiap langkah punya barisnya sendiri.
  #
  # ⚠ SATU REPLIKA, DAN ITU BUKAN PILIHAN PENYEBARAN. Jalur ini tunggal-instans
  # di `contract/kinds.yaml`, dan pelarinya memagari diri dengan
  # `pg_try_advisory_lock`: instans kedua KELUAR tanpa bekerja alih-alih ikut
  # mengklaim. Pagar itu tidak memikul kebenaran — `dedupe_key` yang unik sudah
  # melakukannya — tapi ia mencegah kesalahan konfigurasi yang jauh lebih mudah
  # dilakukan daripada dibayangkan. Sejak penyatuan, pelari yang keluar karena
  # pagar juga mengakhiri container (janji penyelia), jadi menaikkan
  # `deploy.replicas` di sini menghasilkan satu container yang hidup dan satu
  # yang crash-loop — skala jamak hanya lewat profil HA, yang membungkus peran
  # tunggal di belakang leader election (`WORKER_LEADER_ROLES`).
  #
  # Pagarnya memakai `CONTROL_DATABASE_DIRECT_URL` (di `environment:` di bawah):
  # satu koneksi LANGSUNG yang dipegang selama pelari hidup dan dibuktikan
  # ulang tiap denyut (`workers/runner.ts` → `ambilPagar`). Tanpanya pagar
  # lewat PgBouncer mode transaksi — kunci yang tertinggal di backend milik
  # kolam, bukan milik pelari ini.
  #
  # ⚠ INVARIAN I-2 ADA DI SINI, BUKAN DI DOKUMEN. Ini satu-satunya peran latar
  # yang menulis buku besar, dan handler-nya MENDELEGASIKAN ke
  # `src/lib/recurring-run.ts` — mesin yang sama yang dipakai `recurring:run`
  # tangan. Dua mesin untuk satu aturan akuntansi akan menyimpang tanpa satu
  # galat pun, dan yang menyimpang adalah buku.
  #
  # TANPA `timeout` pembungkus, dan itu disengaja — berbeda dari dua putaran
  # di atas. Yang dijaga `timeout` di sana adalah PUTARAN yang menggantung lalu
  # menahan putaran berikutnya selamanya; di sini tidak ada putaran berikutnya
  # yang bisa tertahan. Pekerjaan yang menggantung dijaga oleh LEASE: ia
  # berhenti diperpanjang, ambang reclaim melewatinya, dan barisnya pulang ke
  # `queued` dengan `attempts + 1` — mekanisme yang tahu jenis pekerjaannya,
  # yang tidak bisa dilakukan satu angka detik di compose.
  #
  # ── PERAN `interactive` — EKSPOR YANG DITUNGGU PENGGUNA (tahap 1c, §5) ────
  #
  # ══ IA TIDAK MENGGANTIKAN RUTE EKSPOR SINKRON ══════════════════════════════
  #
  # Ekspor berukuran biasa tetap dirakit di dalam permintaan HTTP dan selesai
  # dalam milidetik — itu jawaban yang benar, dan antrean untuknya hanya
  # menambah penantian. Yang diserahkan ke sini hanya yang di atas
  # `EXPORT_QUEUE_HANDOFF_ROWS`, dan sebabnya bukan ukuran berkasnya melainkan
  # EVENT LOOP: perakitan ExcelJS sinkron dan menahan SETIAP permintaan lain di
  # proses yang sama, termasuk halaman yang sedang dibuka orang lain.
  #
  # ══ TIGA BEDANYA DARI PERAN `ledger`, DAN KETIGANYA DISENGAJA ══════════════
  #
  #  1. **Instansnya boleh BERAPA PUN.** Jalur ini tidak menulis buku dan tidak
  #     menerbitkan apa pun — `FOR UPDATE SKIP LOCKED` memastikan tak ada yang
  #     dikerjakan dua kali. `contract/kinds.yaml` menyatakannya
  #     `single_instance: false`.
  #  2. **Ia butuh volume `hasil` BISA-TULIS** — bersama pasangan Go-nya di
  #     `svc-integrator` (tahap 1d), dan hanya keduanya; `app-customer`
  #     memasangnya hanya-baca dan hanya men-stream. Keduanya berjalan sebagai
  #     uid 1000 = `node`, pembacanya (`contract/kinds.yaml` → `results`). Sejak
  #     penyatuan, tiga peran lain di container ini ikut melihat mount itu;
  #     tidak satu pun menulisnya, dan volume ini tidak memuat buku.
  #  3. **Lewat PgBouncer**, bukan langsung ke `pg`: ia membaca buku SATU PT per
  #     pekerjaan lewat klien per-perusahaan — bukan mencacah seluruh basis data
  #     seperti jalur `tenant`.
  #
  # Container ini TIDAK menerima `BACKUP_ENCRYPTION_KEY`: tidak satu pun dari
  # empat perannya memakainya, dan sejak daftar izin env (Okt 2026) ia memang
  # tidak lagi sampai ke sini (penjaga: `tests/compose-env-allowlist.test.ts`).
  #
  # Berjalan sebagai `node` (uid 1000, `USER node` di tahap `migrator`), bukan
  # root. Satu-satunya yang ditulisnya di cakram adalah volume `hasil` — milik
  # 1000 — dan `data/mail-outbox` di image (juga milik `node`).
  svc-worker:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-svc-worker
    restart: unless-stopped
    init: true
    environment:
      <<: [*env-books, *env-db-instances, *env-mail, *env-billing]
      LICENCE_FILE:
      # `WORKER_LEADER_ROLES` hanya dari override HA — compose dasar tidak
      # pernah menyalakan leader election (`tests/leader-election.test.ts`).
      CONFORMANCE_CONCURRENCY:
      # Buku yang direlay bersamaan oleh peran `outbox` (bawaan 3, plafon 8).
      OUTBOX_RELAY_CONCURRENCY:
      # Pagar jalur `ledger` di koneksi LANGSUNG (lihat kepala blok ini) —
      # disetujui pemilik 22 Okt 2026. LANGSUNG ke `pg`, bukan PgBouncer;
      # `assertDirectUrl` menolak URL pooler sebelum satu byte dikirim. Dijaga
      # `tests/leader-election.test.ts`.
      #
      # Peran APLIKASI (`PG_APP_USER`, tanpa DDL) — kunci advisory tidak butuh
      # hak apa pun. Sebelum peralihan hak minimum jatuh ke `PG_USER`.
      CONTROL_DATABASE_DIRECT_URL: postgres://${PG_APP_USER:-${PG_USER:-sai}}:${PG_APP_PASSWORD:-${PG_PASSWORD}}@pg:5432/sai_control
      # Penyediaan PT baru (`company.provision`, peran `interactive`) — dipindah
      # dari `app-customer` Okt 2026 supaya layanan yang menghadap internet tidak
      # memegang kredensial PEMILIK. Basis data dibuat sebagai PEMILIK
      # (`sai_owner`, NOSUPERUSER CREATEDB) lalu dihibahkan ke peran aplikasi
      # `PG_APP_USER`. Tanpa `PROVISION_DATABASE_URL` penyediaan memakai
      # `CONTROL_DATABASE_URL` — benar sebelum peralihan hak minimum, ditolak
      # 42501 sesudahnya (pesan yang jelas di layar, bukan kerusakan).
      #
      # Nilainya dari `.env` apa adanya (bukan dirakit dari `PG_OWNER_*` di sini),
      # sama seperti sebelumnya di `app-customer` — satu baris `.env`, satu arti.
      #
      # Container menerimanya, tetapi hanya PERAN `interactive` yang mewarisinya:
      # penyelia membuang keduanya dari `ledger`, `scheduler`, dan `conformance`
      # (`OWNER_ONLY_ENV`, scripts/run-workers.ts; tests/worker-owner-env.test.ts).
      PROVISION_DATABASE_URL:
      PG_APP_USER:
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      # Penulisnya peran `interactive` di sini dan pasangan Go-nya di
      # `svc-integrator`. `app-customer` memasangnya `:ro`.
      # Dokumen & jejak TIDAK dipasang: tidak satu peran pun membaca berkas,
      # dan mount yang tidak dibutuhkan adalah permukaan yang tidak perlu ada.
      - hasil:/app/data/hasil
    networks:
      - internal
    # Pelari jalur menyelesaikan pekerjaan yang sedang jalan lalu berhenti
    # mengklaim. 60s bukan "cukup untuk menyelesaikan ekspor" — ekspor besar bisa
    # lebih lama, dan yang menanganinya bukan jendela ini melainkan *lease*:
    # pekerjaan yang terpotong dipulangkan `reclaimStaleJobs` lalu diklaim lagi.
    # Penyelia sendiri memaksa KILL 45 detik sesudah satu peran mati — di bawah
    # jendela ini, supaya ia yang memutuskan, bukan Docker.
    stop_grace_period: 60s
    # Pasangan `<peran>` + `<skrip sh>`. Skrip tiap peran ditulis DI SINI, satu
    # salinan; penyelia tidak tahu apa pun tentang isinya.
    command:
      - bun
      - scripts/run-workers.ts
      - ledger
      - exec bun run jobs:run:ledger
      - interactive
      - exec bun run jobs:run:interactive
      # Relay outbox (09 §4): buku PT → `jobs`. Tunggal-instans (pagar
      # `sai.outbox.relay`), berjalan terus, tanpa `timeout` — alasan yang sama
      # dengan pelari `ledger`: tidak ada putaran berikutnya yang bisa
      # tertahan, dan transaksi bukunya punya batas waktunya sendiri.
      - outbox
      - exec bun run outbox:relay
      - scheduler
      # `notify:setup`, `notify:invoice-due`, dan `remind:customers` menumpang
      # putaran yang SAMA, bukan layanan sendiri-sendiri: cadensinya identik
      # (per jam), semuanya membaca daftar perusahaan yang sama, dan semuanya
      # idempoten (`dedupe_key`, atau kunci unik pengingat). Layanan tersendiri
      # hanya akan menambah container yang bisa mati diam-diam di kotak yang
      # sudah padat.
      #
      # `remind:customers` ditaruh TERAKHIR dengan sengaja (issue #467): ia
      # satu-satunya mata rantai yang mengirim surel KE LUAR, dan menempatkannya
      # di belakang berarti putaran yang mati di tengah gagal pada pekerjaan
      # yang masih bisa diulang tanpa konsekuensi ke orang lain.
      #
      # `prune:trails` ditaruh PALING AKHIR, dan bukan karena ia paling tidak
      # penting: ia satu-satunya mata rantai yang MENGHAPUS. Menempatkannya di
      # belakang berarti putaran yang mati di tengah berhenti pada pekerjaan
      # yang masih bisa diulang — bukan pada satu-satunya yang tidak punya
      # langkah balik. Alasan yang sama yang menaruh `remind:customers` di
      # belakang, hanya dengan risiko yang berbeda bentuknya.
      #
      # Per jam jauh lebih sering daripada yang dibutuhkan ambang 90 hari, dan
      # itu disengaja: putaran yang tidak menemukan apa pun berhenti pada satu
      # `SELECT` per tabel — lebih murah daripada satu cadensi lagi yang harus
      # dijaga seseorang.
      #
      # `|| true` di tiap mata rantai disengaja: satu produser yang gagal tidak
      # boleh menelan yang berikutnya — putarannya harus tetap sampai `sleep`.
      #
      # ⚠ `|| true` TIDAK cukup, dan itu terbukti di produksi 30 Agu 2026.
      # Ia melindungi dari langkah yang GAGAL, bukan dari yang MENGGANTUNG:
      # `scheduler:subscriptions` menggantung dua jam dengan CPU 0,09%, putaran
      # itu tak pernah sampai ke `sleep`, dan SELURUH putaran berikutnya
      # tertahan selamanya. Gejalanya menyesatkan — container "Up", log
      # terakhir "✓ selesai tanpa masalah", nol galat di mana pun; yang
      # menyingkapkannya cuma `/api/health` → `scheduler: late` dan
      # `docker top`.
      #
      # Karena itu tiap langkah dibungkus `timeout`, dan batasnya DITURUNKAN
      # setiap kali satu langkah ditambahkan. Aturannya satu: **jumlah langkah ×
      # batas harus tetap di bawah selang putarannya (3600s)**, supaya putaran
      # terburuk sekalipun tidak menumpuk lebih dari satu.
      #
      #   5 langkah × 600s = 50 menit   (sebelum `prune:trails`)
      #   6 langkah × 600s = 60 menit   (tepat di batas — nol ruang sisa)
      #   7 langkah × 480s = 56 menit   (setelah `watch:health` ikut)
      #   8 langkah × 420s = 56 menit   ← sekarang, setelah `backup:publish` ikut
      #
      # ⚠ `recurring:run` menjadi `recurring:publish` (rancangan §4), dan BATAS
      # tidak diturunkan karena jumlah langkah tidak berubah. Yang berubah lebih
      # dalam daripada namanya: langkah itu berhenti MELAKSANAKAN. Ia kini
      # menulis satu baris `jobs` per PT dan selesai dalam milidetik, dan yang
      # memposting dokumen berulang adalah peran `ledger`. Perhitungan di atas
      # memang dibuat terhadap langkah yang melaksanakan, jadi satu langkah yang
      # keluar dari perhitungan itu adalah ruang yang bertambah, bukan berkurang.
      #
      # `watch:backup` menjadi `watch:health` 12 Okt 2026 — ia kini memeriksa
      # TIGA denyut (cadangan, penjadwal, kesesuaian) dalam satu langkah. Jumlah
      # langkah TIDAK bertambah, jadi BATAS tidak perlu turun lagi.
      #
      # `prune:trails` TETAP paling akhir, dan `watch:backup` disisipkan SEBELUM
      # ia — bukan sesudahnya. Alasannya bukan selera: `prune:trails` satu-satunya
      # langkah yang MENGHAPUS, dan putaran yang mati di tengah harus berhenti
      # pada pekerjaan yang masih bisa diulang, bukan pada satu-satunya yang tak
      # punya langkah balik. Dijaga `tests/run-trail-retention.test.ts`.
      #
      # ⚠ PENERBIT TEPAT SATU (Okt 2026): `recurring:publish` dan
      # `backup:publish` TETAP di putaran ini, dan masing-masing keluar 0 tanpa
      # menyentuh antrean bila `contract/kinds.yaml` menyerahkan kind-nya ke
      # jalur `schedule` Go (`schedule.publisher: go`). Jadi peralihan penerbit
      # — dan jalan mundurnya — tidak pernah menyentuh baris di sini; dijaga
      # `tests/schedule-lane.test.ts`.
      #
      # ⚠ `backup:publish` adalah langkah KEDELAPAN, dan BATAS diturunkan
      # 480 → 420 karena itu. Aturannya aritmetika, bukan selera, dan
      # `tests/scheduler-heartbeat.test.ts` menghitungnya: 8 × 420 = 3.360s,
      # masih di bawah selang 3.600s.
      #
      # Ia BISA diperdebatkan — langkah ini menerbitkan satu baris `jobs` dan
      # selesai dalam milidetik, sama seperti `recurring:publish`, jadi dua dari
      # delapan langkah sekarang praktis nol. Tapi aturan di atas ditulis sebagai
      # aritmetika justru supaya ia tidak perlu bergantung pada penalaran tentang
      # langkah mana yang cepat: penalaran itu benar hari ini dan akan salah pada
      # hari seseorang menukar isi sebuah langkah tanpa menukar namanya.
      #
      # Peringatan yang sama berlaku untuk langkah KESEMBILAN. `-k 30`
      # mengirim KILL 30 detik setelah TERM untuk proses yang membandel —
      # Prisma yang menahan event loop tidak selalu pergi karena TERM saja.
      #
      # Yang dibunuh BERBUNYI di log beserta nama langkahnya. Timeout yang
      # diam adalah cacat yang sama dengan `|| true` yang diam: pekerjaan
      # berhenti dikerjakan tanpa ada yang tahu.
      - |
        langkah() {
          nama="$$1"; shift
          timeout -k 30 "$$BATAS" "$$@"
          kode=$$?
          if [ "$$kode" = 124 ] || [ "$$kode" = 137 ]; then
            echo "[penjadwal] ⏱ '$$nama' DIBUNUH setelah $${BATAS}s — putaran lanjut."
          elif [ "$$kode" != 0 ]; then
            echo "[penjadwal] ✗ '$$nama' gagal (kode $$kode) — putaran lanjut."
          fi
          return 0
        }
        BATAS=420
        while true; do
          langkah scheduler:subscriptions bun run scheduler:subscriptions
          langkah notify:setup bun run notify:setup
          langkah notify:invoice-due bun run notify:invoice-due
          langkah remind:customers bun run remind:customers
          langkah recurring:publish bun run recurring:publish
          langkah backup:publish bun run backup:publish
          langkah watch:health bun run watch:health
          langkah prune:trails bun run prune:trails
          sleep 3600
        done
      - conformance
      # Tanggalnya dicetak sebagai perintah TERSENDIRI, bukan `$(date)` di dalam
      # string: compose menafsirkan `$` sebagai interpolasi variabelnya sendiri,
      # dan aturan pelolosannya adalah hal yang tidak perlu ditebak-tebak untuk
      # sekadar sebuah stempel waktu.
      # `timeout` dengan alasan yang sama dengan penjadwal: pemeriksaan yang
      # menggantung menahan pemeriksaan MINGGU-MINGGU berikutnya, dan pada
      # cadensi mingguan cacat itu bisa berumur berbulan-bulan sebelum ada yang
      # menyadarinya. 1800 detik longgar untuk pemeriksaan yang menyapu seluruh
      # buku setiap perusahaan.
      - |
        while true; do
          echo '── kesesuaian data ──'
          date -Iseconds
          timeout -k 30 1800 bun run check-data-conformance
          kode=$$?
          [ "$$kode" = 124 ] || [ "$$kode" = 137 ] \
            && echo "[kesesuaian] ⏱ DIBUNUH setelah 1800s — dicoba lagi minggu depan."
          sleep 604800
        done

  # ── CADANGAN (issue #374) ─────────────────────────────────────────────────
  # Menjual langganan atas pembukuan yang WAJIB disimpan sepuluh tahun (UU KUP)
  # tanpa cadangan otomatis bukan risiko teknis, melainkan risiko hukum.
  #
  # Ia butuh volume yang SAMA dengan `web` — tapi HANYA-BACA (`:ro`): layanan
  # yang tugasnya menyalin tidak punya satu alasan pun untuk bisa menulis, dan
  # bendera itu menghapus seluruh kelas kecelakaan di mana skrip cadangan justru
  # merusak yang dicadangkannya.
  #
  # Sekali sehari, bukan sejam sekali: dump seluruh basis data + berkas adalah
  # pekerjaan berat di kotak ini, dan RPO satu hari adalah janji yang jujur untuk
  # skala sekarang. Menaikkannya berarti menaikkan ongkosnya juga — putuskan
  # sadar-sadar, jangan diam-diam.
  job-backup:
    build:
      context: .
      target: backup
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-backup:${SAI_TAG:-latest}
    container_name: sai-job-backup
    # `"no"`, bukan `unless-stopped`: perintahnya kini satu penjelasan yang
    # keluar dengan kode 0 (lihat di bawah), dan `unless-stopped` atas perintah
    # yang berakhir adalah crash-loop yang mengisi log tanpa mengerjakan apa pun.
    restart: "no"
    # ══ CADANGAN MENYAMBUNG LANGSUNG KE `pg`, MELEWATI PgBouncer ═══════════
    #
    # `pg_dumpall` harus MENDAFTAR seluruh basis data lebih dulu (`pg_database`)
    # lalu menyambung ke tiap-tiap basis data itu satu per satu. PgBouncer hanya
    # mengekspos basis data yang terdaftar di konfigurasinya, jadi lewat pooler
    # dump "seluruh basis data" akan memulangkan sebagian — dan sebagian itulah
    # bentuk cadangan yang paling berbahaya: ia ADA, ia tampak berhasil, dan ia
    # baru ketahuan kurang pada hari pemulihan.
    #
    # `scripts/backup.sh` menurunkan host, port, peran, dan sandi dari URL ini,
    # jadi satu baris mengatur keempatnya sekaligus.
    #
    # ⚠ SUPERUSER, DAN ITU DIPUTUSKAN (hak minimum, Okt 2026). Layanan ini
    # PERKAKAS yang dijalankan tangan (`run --rm`), tidak pernah hidup terus,
    # tidak punya port, dan tidak memproses masukan siapa pun. Yang
    # dikerjakannya butuh hak superuser sungguhan: `pg_dumpall` lengkap dengan
    # peran & sandinya, dan `prove-backup-restore` yang memulihkan `globals.sql`
    # (CREATE ROLE) ke basis data bayangan. Layanan yang HIDUP TERUS memakai
    # peran tersempit: aplikasi `sai_app`, jalur `tenant` `sai_backup`.
    #
    # `PROVISION_DATABASE_URL` + `PG_APP_USER` dari `.env`: `tenant:move`
    # membuat basis data di instans tujuan sebagai PEMILIK dan menghibahkannya
    # ke peran aplikasi, sama seperti penyediaan di aplikasi.
    environment:
      <<: [*env-books, *env-db-instances, *env-backup]
      DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/${DB_NAME:-sai_production}
      PROVISION_DATABASE_URL:
      PG_APP_USER:
      SETTINGS_ENCRYPTION_KEY:
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    volumes:
      - documents:/app/data/documents:ro
      - audit:/app/data/audit:ro
      # ⚠ SATU-SATUNYA mount yang bisa DITULIS layanan ini, dan hanya untuk
      # hasilnya sendiri. Dipakai ketika `BACKUP_S3_BUCKET` belum disetel:
      # artefak terenkripsi mendarat di sini alih-alih tidak dibuat sama sekali.
      # Dua mount di atas TETAP `:ro` — yang dicadangkan tidak boleh bisa
      # dirusak oleh yang mencadangkannya.
      - cadangan:/app/data/cadangan
    networks:
      - internal
    # ══ LAYANAN INI BERHENTI MENCADANGKAN (tahap 1b) ═══════════════════════
    #
    # Yang mencadangkan sekarang jalur `tenant` di `svc-integrator` (Go), dan ia
    # mencadangkan SATU OBJEK PER BASIS DATA — menutup celah on-premise #5: `pg_dumpall` berarti
    # satu tenant tidak bisa dipulihkan tanpa menyentuh tenant lain, padahal
    # "pulihkan data kami saja ke keadaan Selasa" adalah permintaan biasa di
    # SaaS berbayar (§1, §6).
    #
    # ⚠ CUT-OVER, BUKAN PENAMBAHAN. Membiarkan putaran harian di bawah tetap
    # hidup berarti DUA pelaksana untuk satu pekerjaan — dan yang memisahkan
    # keduanya hanya nama berkas yang kebetulan berbeda. Dua putaran cadangan
    # yang berjalan bersamaan di kotak ini bukan redundansi, ia dua `pg_dump`
    # yang berebut IO pada mesin yang satu dumpnya saja pekerjaan berat.
    #
    # ══ KENAPA LAYANANNYA TETAP ADA ════════════════════════════════════════
    # Ia menjadi PERKAKAS, dan itu memang perannya di PRODUCTION.md sejak awal:
    #
    #   docker compose run --rm job-backup bun run prove-backup-restore
    #   docker compose run --rm job-backup sh scripts/backup.sh --dry-run
    #   docker compose run --rm job-backup ls -lh /app/data/cadangan
    #
    # Image-nya satu-satunya yang punya klien Prisma (untuk mencocokkan registry
    # PT), `openssl`, `awscli`, DAN `postgresql-client-17` sekaligus (klien
    # MariaDB-nya dicabut di #636). `svc-integrator` sengaja tidak memuat semua
    # itu.
    #
    # `profiles` membuatnya TIDAK ikut `docker compose up -d`, sementara
    # `docker compose run` tetap bisa memanggilnya. Dan `command`-nya diganti
    # menjadi penjelasan yang keluar dengan kode 0: kalau suatu hari seseorang
    # menyalakan profil ini, yang terjadi satu baris log — bukan putaran cadangan
    # kedua yang tak ada yang memintanya.
    profiles: ["perkakas"]
    command:
      - sh
      - -c
      - |
        echo "[backup] Layanan ini PERKAKAS, bukan pelaksana (tahap 1b)."
        echo "[backup] Yang mencadangkan: svc-integrator (jalur tenant) — satu objek per basis data."
        echo "[backup] Pakai: docker compose run --rm job-backup bun run prove-backup-restore"
        exit 0

  # ══ `svc-integrator` — TIGA JALUR GO, SATU PROSES ═════════════════════════
  #
  # Keputusan pemilik 22 Okt 2026: **1 image = 1 container**. Image
  # `-integrator` dulu menjalankan DUA container — `svc-tenant` (cadangan) dan
  # `svc-interactive-go` (lembar sebar laporan) — dan kini satu biner
  # (`cmd/integrator`) yang menjalankan setiap pelari bersamaan: `tenant`,
  # `interactive` sisi Go, dan sejak Okt 2026 `schedule` (denyut penerbitan,
  # lihat di bawah). Satu pelari berakhir → yang lain dihentikan → proses
  # keluar bukan-nol → `restart: unless-stopped` menghidupkan semuanya utuh.
  # Tidak ada container setengah-hidup. Jalur `bulk` punya kerangkanya
  # (`internal/bulklane`) tetapi TIDAK dijalankan sampai ada kind ber-handler.
  #
  # `svc-`, bukan `job-`: ia BERJALAN TERUS menguras antrean.
  #
  # ⚠ GELAR PERTAMA WAJIB `--remove-orphans` — alasan yang sama dengan
  # `svc-worker`: `svc-tenant` dan `svc-interactive-go` lama yang tetap hidup
  # berarti dua pengklaim `report.export_go` dan dua pelari cadangan yang
  # berebut pagar.
  #
  # ══ RAHASIA CADANGAN KINI SEPROSES DENGAN MASUKAN PENGGUNA — DIPUTUSKAN ════
  #
  # Sampai penyatuan ini `BACKUP_ENCRYPTION_KEY` dan kredensial S3 hidup di
  # proses yang TIDAK memproses masukan pengguna, dan itu alasan jalur `tenant`
  # punya container sendiri. Pemilik menerima risikonya dengan sadar: parameter
  # laporan (jalur `interactive`) kini diurai di proses yang bisa membaca kunci
  # cadangan dan punya sambungan LANGSUNG ke `pg`. Risikonya, mitigasinya, dan
  # apa yang membuat kita memisahkannya lagi: 09-RANCANGAN-LAYANAN.md §3.2
  # ("Keputusan 22 Okt 2026").
  #
  # Sejak daftar izin env (Okt 2026) container ini menerima HANYA yang
  # dibacanya — tanpa berkas env kedua di mesin customer: nilainya tetap dari
  # `.env` yang sama, yang disaring adalah NAMA-nya. Ia satu-satunya layanan
  # yang hidup terus dan memegang `BACKUP_*`/`AWS_*`; tidak lagi memegang
  # `OPERATOR_*`, `AUTH_SECRET`, kunci gerbang pembayaran, atau SMTP.
  #
  # Berjalan sebagai uid 1000 (`USER 1000:1000` di tahap `integrator`), bukan
  # root: volume `cadangan` dan `hasil` milik 1000, `documents`/`audit` dibaca
  # hanya-baca. Volume `cadangan` yang lahir sebelum perubahan ini milik root
  # dan WAJIB di-`chown` sekali sebelum gelar (PRODUCTION.md §Env allowlist).
  #
  # ══ DUA JALAN KE BASIS DATA, DAN KEDUANYA DIPERTAHANKAN ════════════════════
  #
  #  • Jalur `tenant` menyambung LANGSUNG ke `pg` lewat
  #    `CONTROL_DATABASE_DIRECT_URL`, MELEWATI PgBouncer. Ia MENDAFTAR seluruh
  #    basis data (`pg_database`) lalu menyambung ke tiap-tiap basis data satu
  #    per satu; PgBouncer hanya mengekspos basis data yang terdaftar di
  #    konfigurasinya, jadi lewat pooler pencacahan akan memulangkan sebagian —
  #    dan sebagian itulah bentuk cadangan paling berbahaya: ia ADA, ia tampak
  #    berhasil, dan ia baru ketahuan kurang pada hari pemulihan. URL yang sama
  #    memegang pagar advisory lock jalur tunggal-instans ini, dan menjadi
  #    parameter sambungan `pg_dump` (`internal/db/dsn.go`). Go MENOLAK URL itu
  #    bila terbaca sebagai pooler.
  #  • Jalur `interactive` membaca registry & antrean lewat `CONTROL_DATABASE_URL`
  #    dari `.env` (PgBouncer) dan buku satu PT per pekerjaan — bukan
  #    pencacahan seluruh server.
  #
  # Dulu satu nama (`CONTROL_DATABASE_URL`) ditimpa di `environment:` khusus
  # untuk `svc-tenant`. Satu proses tidak bisa punya dua nilai untuk satu nama,
  # jadi jalan langsung kini bernama sendiri — nama yang SAMA dengan yang
  # dipakai pagar Node di `svc-worker`.
  #
  # ══ INSTANS BASIS DATA TAMBAHAN (tahap 4) ══════════════════════════════════
  #
  # Buku PT di instans lain dicadangkan dari server instans itu, dengan URL dari
  # env var yang NAMANYA tercatat di `db_instances`
  # (`COMPANY_<KUNCI>_DATABASE_URL_TEMPLATE`). Namanya sampai ke sini lewat
  # grup `*env-db-instances`, sama seperti ke setiap layanan lain yang membuka
  # buku — JANGAN menulisnya per layanan (ditolak
  # `tests/db-instance-env-reaches-every-service.test.ts`). Nilainya wajib
  # LANGSUNG ke PostgreSQL; Go menolak URL yang menyatakan `pgbouncer=true`.
  #
  # ══ JALUR `interactive` SISI GO (tahap 1d) ═════════════════════════════════
  #
  # Satu jalur, DUA pelari: peran `interactive` (Node) di `svc-worker` mengklaim
  # `report.export`; pelari Go di sini mengklaim `report.export_go`. Laporan
  # mana yang sampai ke sini diputuskan register `src/lib/report-engine.ts`
  # (`engine: go` — hari ini Neraca Saldo), dan untuk laporan itu rute ekspor
  # SELALU mengantre, berapa pun barisnya. Tanpa layanan ini ekspor Neraca
  # Saldo menumpuk sebagai baris `queued` tanpa pengklaim — tombol unduhnya
  # menunggu sepuluh menit lalu menyerah, dan tidak satu halaman pun rusak.
  #
  # ══ JALUR `schedule` — DENYUT PENERBITAN (tahap 1c, 09 §3.2) ═════════════
  #
  # Menerbitkan kind ber-`schedule:` di `contract/kinds.yaml` yang
  # `publisher`-nya `go` — HANYA menulis baris `jobs`; yang memposting dokumen
  # berulang tetap peran `ledger` di `svc-worker` (I-2). BAWAANNYA DIAM:
  # selama kontrak menyatakan `publisher: node` (keadaan hari ini), jalur ini
  # memegang pagarnya (`sai.lane.schedule`, lewat
  # `CONTROL_DATABASE_DIRECT_URL`) dan tidak menerbitkan apa pun, dan langkah
  # `recurring:publish`/`backup:publish` di peran `scheduler` yang
  # menerbitkan. Peralihan ke Go dan jalan mundurnya SATU BARIS kontrak + rilis,
  # tanpa perubahan di berkas ini — PRODUCTION.md §Penerbit denyut. Tidak ada
  # env baru: pekerjaannya lewat `CONTROL_DATABASE_URL` (PgBouncer), pagarnya
  # lewat sambungan langsung yang sudah ada untuk jalur `tenant`.
  #
  # Memori: biner statis Go, tanpa Node — puluhan MB saat diam (09 §3.3).
  svc-integrator:
    build:
      context: .
      target: integrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-integrator:${SAI_TAG:-latest}
    container_name: sai-svc-integrator
    restart: unless-stopped
    environment:
      <<: [*env-db-instances, *env-backup]
      # Jalur `interactive`: registry & antrean lewat PgBouncer, buku satu PT
      # per pekerjaan dari template (`internal/ledgerread`).
      CONTROL_DATABASE_URL:
      DATABASE_URL:
      COMPANY_DATABASE_URL_TEMPLATE:
      TZ:
      PG_DUMP_BIN:
      PG_DUMPALL_BIN:
      # Jalur `integration` SAJA (e-Faktur lewat PJAP, docs/EFAKTUR.md): kunci
      # yang SAMA dengan `app-customer` — Node menyegel kredensial PJAP milik PT,
      # pelari ini membukanya tepat sebelum mengirim. Tanpa kunci ini kiriman
      # ke penyedia `pjap` gagal `failed` dengan pesan yang terbaca; `mock` dan
      # unggah XML manual tidak terpengaruh.
      SETTINGS_ENCRYPTION_KEY:
      # Sapuan kesesuaian data jalur `tenant` (bila `runner: go` untuk
      # `tenant.conformance`): buku dibaca dari template di atas, batas
      # serentaknya env yang SAMA dengan peran `conformance` di `svc-worker`
      # (bawaan 3, plafon 8) — satu nilai, dua kemungkinan pelaksana.
      CONFORMANCE_CONCURRENCY:
      # Jalur `tenant` SAJA. `CONTROL_DATABASE_URL` sengaja TIDAK ditimpa di
      # sini: jalur `interactive` di proses yang sama memakainya lewat PgBouncer.
      #
      # Peran CADANGAN (`PG_BACKUP_USER` = `sai_backup`: anggota `sai_app` +
      # `pg_read_all_data`) — cukup untuk `pg_dump` setiap buku, `pg_dumpall
      # --globals-only`, jejak `backup_runs`, dan pagar advisory lock; tidak
      # cukup untuk DDL atau membuat peran. Sebelum peralihan hak minimum jatuh
      # ke superuser `PG_USER`, persis perilaku lama.
      CONTROL_DATABASE_DIRECT_URL: postgres://${PG_BACKUP_USER:-${PG_USER:-sai}}:${PG_BACKUP_PASSWORD:-${PG_PASSWORD}}@pg:5432/sai_control
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      # Hanya-baca, dan itu menghapus seluruh kelas kecelakaan di mana jalur
      # cadangan justru merusak yang dicadangkannya.
      - documents:/app/data/documents:ro
      - audit:/app/data/audit:ro
      # Artefak cadangan terenkripsi ketika `BACKUP_S3_BUCKET` belum disetel:
      # mendarat di sini alih-alih tidak dibuat sama sekali.
      - cadangan:/app/data/cadangan
      # Hasil ekspor jalur `interactive` sisi Go. Berjalan sebagai uid 1000 —
      # uid yang sama dengan `node`, pembaca volume itu di `app-customer`
      # (`contract/kinds.yaml` → `results`) — jadi berkasnya lahir dengan
      # pemilik yang benar; `chown` hanya terjadi bila image lama (root) dipakai.
      - hasil:/app/data/hasil
    networks:
      - internal
    # Pelari menyelesaikan pekerjaan yang sedang jalan lalu berhenti mengklaim.
    # 60s bukan "cukup untuk menyelesaikan dump" — dump bisa berjam-jam, dan
    # yang menanganinya bukan jendela ini melainkan *lease*: pekerjaan yang
    # terpotong dipulangkan oleh `ReclaimStale` lalu diklaim lagi. Yang dibeli
    # 60 detik adalah penulisan objek yang sedang berjalan selesai rapi.
    stop_grace_period: 60s
    command: ["svc-integrator"]

  # ── DUA APLIKASI, DUA IMAGE ────────────────────────────────────────────────
  #
  # Aplikasi pelanggan (`src/`, image `sai-accounting`) dan konsol operator
  # (`apps/operator`, image `sai-accounting-operator`) adalah dua aplikasi Next
  # yang dibangun dari commit yang sama dan ditarik dengan `SAI_TAG` yang sama;
  # keduanya menulis basis data yang sama, jadi versi skemanya harus satu.
  # Bidangnya ditentukan host (`packages/core/src/operator-plane.ts`): image
  # pelanggan tidak memuat rute konsol, dan konsol menjawab 404 untuk host
  # selain `OPERATOR_HOST`. Lihat docs/arsitektur/07-RIWAYAT.md
  #
  # ⚠ NAMA SERVICE TRAEFIK HARUS BERBEDA (`sai-app` vs `sai-ops`). Kalau
  # keduanya memakai nama service yang sama, Traefik menganggapnya SATU service
  # dengan dua backend lalu menyeimbangkan beban di antaranya — dan permintaan
  # operator bisa mendarat di container pelanggan. Itu membatalkan seluruh
  # alasan pemisahan ini ada, tanpa satu pun galat.

  # ── BIDANG PELANGGAN ────────────────────────────────────────────────────────
  # Enam grup rute: (marketing), (auth), (tenant)/(panel), (dashboard), (setup),
  # (docs). Inilah container yang melayani pembukuan, jadi ia yang memegang
  # volume `documents`.
  app-customer:
    build:
      context: .
      target: runner
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}:${SAI_TAG:-latest}
    container_name: sai-app-customer
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      <<: [*env-books, *env-db-instances, *env-mail, *env-billing]
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SECRET:
      AUTH_URL:
      AUTH_TRUST_HOST:
      LICENCE_FILE:
      MAINTENANCE_FROM:
      MAINTENANCE_UNTIL:
      # ⚠ TANPA `PROVISION_DATABASE_URL` / `PG_OWNER_*` — DENGAN SENGAJA (Okt
      # 2026). `/companies/new` hanya MENERBITKAN pekerjaan `company.provision`;
      # basis datanya dibuat `svc-worker` (jalur `interactive`), satu-satunya
      # layanan hidup-terus yang memegang kredensial PEMILIK. Container yang
      # menghadap internet ini memegang `sai_app` saja (DML, tanpa DDL, tanpa
      # CREATE DATABASE). Dijaga `tests/provisioning-off-app-customer.test.ts`.
      # Satu-satunya `OPERATOR_*` di sini selain penjaga di bawah, dan ia BUKAN
      # rahasia: jumlah proxy di depan aplikasi, dibaca `client-ip` untuk alamat
      # klien pembatas laju. Penjaga mengizinkannya dengan nama, bukan dengan pola.
      OPERATOR_TRUSTED_PROXY_HOPS:
      # ⚠ DIKOSONGKAN DENGAN SENGAJA — ini penjaga, bukan kelalaian.
      #
      # Sejak daftar izin env, `.env` tidak lagi mengalir ke sini, jadi
      # OPERATOR_HOST memang tidak akan sampai. Baris ini tetap ditulis sebagai
      # PERNYATAAN: walau seseorang kelak menambahkannya ke grup bersama,
      # container INI menerimanya kosong. `configuredOperatorHost()` lalu
      # menjawab null, dan `decideOperatorRouting` menjawab `blocked` untuk
      # setiap /operator — 404.
      #
      # Artinya konsol operator tidak terjangkau di sini BAHKAN BILA seseorang
      # berhasil mengirim Host operator langsung ke container ini, melewati
      # Traefik. Itu lapis yang tidak dimiliki susunan satu-container.
      OPERATOR_HOST: ""
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Node 22 ships global fetch — no curl/wget needed in the image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Berkas dokumen sejak issue #367. Volume `uploads` (public/) DICABUT
      # 2026-08-16 sesuai syarat yang ditulis di sini sendiri: pemindahannya
      # sudah dijalankan dan melaporkan 0 dipindahkan · 0 yatim, atas tabel
      # `documents` yang berisi 0 baris di keempat PT. Jadi tidak ada dokumen
      # lama yang kehilangan tempat — memang tidak pernah ada.
      - documents:/app/data/documents
      - audit:/app/data/audit
      # Hasil pekerjaan, HANYA-BACA (rancangan §4). Aplikasi men-stream byte-nya
      # lewat route handler ber-izin dan tidak punya satu alasan pun untuk
      # menulisnya — yang menulis adalah pelari jalur. Bendera `:ro` menghapus
      # seluruh kelas kecelakaan di mana permintaan HTTP mengubah hasil
      # pekerjaan orang lain.
      - hasil:/app/data/hasil:ro
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      # Attach routing to the shared Traefik network (not `internal`).
      - "traefik.docker.network=traefik_default"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.sai-app.entrypoints=web"
      - "traefik.http.routers.sai-app.rule=Host(`${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-app.middlewares=sai-https"
      - "traefik.http.middlewares.sai-https.redirectscheme.scheme=https"
      # HTTPS router with the existing Let's Encrypt resolver
      - "traefik.http.routers.sai-app-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-app-secure.rule=Host(`${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-app-secure.tls=true"
      - "traefik.http.routers.sai-app-secure.tls.certresolver=le"
      - "traefik.http.routers.sai-www.entrypoints=web"
      - "traefik.http.routers.sai-www.rule=Host(`www.${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-www.middlewares=sai-www-apex"
      - "traefik.http.routers.sai-www-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-www-secure.rule=Host(`www.${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-www-secure.middlewares=sai-www-apex"
      - "traefik.http.routers.sai-www-secure.tls=true"
      - "traefik.http.routers.sai-www-secure.tls.certresolver=le"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.regex=^https?://www\\.([^/]+)(.*)"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.replacement=https://$${1}$${2}"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.permanent=true"
      # Which container port Traefik forwards to
      - "traefik.http.services.sai-app.loadbalancer.server.port=3000"
      # Traefik-side health probe
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.timeout=5s"

  # ── BIDANG OPERATOR (issue #154) — HOSTNAME SENDIRI ─────────────────────────
  # Container-nya kini TERPISAH; yang memisahkan BIDANG-nya tetap HOST. Cookie
  # berlingkup host, jadi sesi pelanggan yang bocor tidak pernah bisa menjangkau
  # konsol operator, dan sebaliknya — itulah seluruh alasan pemisahan ini ada,
  # dan kenapa konsol ini TIDAK boleh menumpang di domain aplikasi.
  # Penjaga aplikasi menegakkan hal yang sama dari sisi kode: di host operator
  # setiap rute pelanggan 404, di host pelanggan setiap /operator 404. Tanpa
  # OPERATOR_HOST di .env, /operator 404 di MANA PUN.
  #
  # ⚠️  MENAMBAH PROXY DI DEPAN TRAEFIK? BACA INI DULU (issue #162).
  # Daftar IP operator (OPERATOR_IP_ALLOWLIST) membandingkan alamat klien
  # yang dibaca dari `x-forwarded-for`. Aplikasi mengambil entri ke-N dari
  # KANAN, dengan N = OPERATOR_TRUSTED_PROXY_HOPS (bawaan 1 = Traefik saja,
  # yaitu susunan sekarang). Entri paling kanan adalah satu-satunya yang
  # ditulis Traefik sendiri; yang di kirinya bisa saja diketik klien.
  #
  # Menaruh Cloudflare, CDN, atau load-balancer kedua DI DEPAN Traefik
  # menambah satu hop: setel OPERATOR_TRUSTED_PROXY_HOPS=2 di .env pada
  # perubahan yang SAMA. Kalau lupa, yang terbaca adalah alamat CDN — dan
  # seluruh dunia yang lewat CDN itu tampak sebagai satu IP.
  #
  # Sebaliknya, JANGAN menurunkan angkanya di bawah jumlah proxy yang
  # sebenarnya: setiap hop yang tidak dihitung adalah satu entri kiriman
  # klien yang ikut dipercaya. Rantai yang lebih pendek dari angka ini
  # ditolak (gagal-tertutup), bukan ditebak.
  app-operator:
    # Aplikasi Next TERSENDIRI sejak monorepo Fase 3d + 4 (`apps/operator`).
    # Image pelanggan tidak lagi memuat konsol; image ini tidak memuat satu pun
    # halaman buku. Ditarik dari tag yang SAMA (`SAI_TAG`) dengan app-customer —
    # keduanya menulis basis data yang sama, jadi versi skemanya harus satu.
    build:
      context: .
      target: runner-operator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-operator:${SAI_TAG:-latest}
    container_name: sai-app-operator
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      <<: [*env-books, *env-db-instances, *env-mail, *env-billing]
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Tautan surel ke host PELANGGAN (bukan host konsol).
      AUTH_URL:
      # `OPERATOR_HOST` datang dari `.env` apa adanya — TIDAK ditimpa di sini.
      # Tanpa nilainya, `decideOperatorRouting` menjawab `blocked` untuk setiap
      # /operator dan container ini tidak melayani apa pun yang berguna. Itu
      # gagal-tertutup: konsol yang salah konfigurasi menjadi 404, bukan terbuka.
      #
      # ⚠ RAHASIA KONSOL — HANYA di container ini. Penjaga menolak `OPERATOR_*`
      # di layanan lain (kecuali dua nama non-rahasia di `app-customer`).
      OPERATOR_HOST:
      OPERATOR_SESSION_SECRET:
      OPERATOR_USERS:
      OPERATOR_MFA:
      OPERATOR_IP_ALLOWLIST:
      OPERATOR_TRUSTED_PROXY_HOPS:
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Dihubungi lewat 127.0.0.1, yaitu host yang BUKAN OPERATOR_HOST. Di sana
      # `decideOperatorRouting` menjawab `customer`, lalu `/api/health` lolos
      # sebagai jalur publik — jadi probe ini tetap 200 dan tidak menuntut
      # kelonggaran khusus di penjaga.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # HANYA `audit` — dan itu hasil pemeriksaan, bukan dugaan.
      #
      # Jejak operator tinggal di tabel `operator_audit_logs` sejak migration
      # platform 0002, dan berkas lamanya sudah dipindahkan di produksi
      # (17 Okt 2026). Volume ini tinggal arsip `.dipindahkan` dan aman dicabut.
      # Konsol tidak pernah menyentuh `data/documents`.
      #
      # Tidak memasang volume yang tidak dibutuhkan adalah pengurangan HAK,
      # bukan penghematan: berkas dokumen setiap pelanggan kini berada di luar
      # jangkauan proses konsol operator.
      - audit:/app/data/audit
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # ⚠ TIDAK ADA router untuk APP_DOMAIN di sini — dan itu disengaja.
      # Container ini hanya boleh dijangkau lewat OPERATOR_DOMAIN. Menambahkan
      # router APP_DOMAIN akan membuatnya ikut melayani rute pelanggan, yang
      # membatalkan pemisahan ini.
      - "traefik.http.routers.sai-ops.entrypoints=web"
      - "traefik.http.routers.sai-ops.rule=Host(`${OPERATOR_DOMAIN:-ops.saiaccounting.id}`)"
      - "traefik.http.routers.sai-ops.middlewares=sai-https"
      - "traefik.http.routers.sai-ops-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-ops-secure.rule=Host(`${OPERATOR_DOMAIN:-ops.saiaccounting.id}`)"
      - "traefik.http.routers.sai-ops-secure.tls=true"
      - "traefik.http.routers.sai-ops-secure.tls.certresolver=le"
      # Nama service SENDIRI — lihat peringatan di kepala blok ini.
      - "traefik.http.services.sai-ops.loadbalancer.server.port=3000"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.timeout=5s"

  # ══ cache-redis — TAHAP 2, OPT-IN (09 §3.4, §9) ═══════════════════════════
  #
  # DI BELAKANG PROFILE `replika`: `docker compose up -d` biasa TIDAK
  # menyalakannya, dan produksi satu-replika tidak berubah satu bit pun. Yang
  # menyalakannya `docker-compose.replika.yml` (yang juga menyetel
  # `CACHE_REDIS_URL` di aplikasi) — tanpa variabel itu aplikasi bahkan tidak
  # memuat klien Redis-nya.
  #
  # Isinya HANYA yang boleh hilang (09 §3.4): pesan invalidasi cache antar-
  # replika, penghitung pembatas laju bersesi, sewa penyimpanan, buku tag Next.
  # Karena itu tanpa persistensi sama sekali (`--save ""`, tanpa AOF) dan
  # dengan pengusiran LRU: Redis yang dikosongkan = aplikasi melambat sebentar,
  # tidak pernah pekerjaan hilang. Ia BUKAN antrean — antreannya tabel `jobs`.
  cache-redis:
    image: redis:7.2-alpine
    container_name: sai-cache-redis
    restart: unless-stopped
    profiles: ["replika"]
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${CACHE_REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

networks:
  traefik:
    name: traefik_default
    external: true
  internal:
    driver: bridge

volumes:
  # `db_data` (MariaDB) TIDAK lagi dideklarasikan (#636). Menghapus deklarasinya
  # TIDAK menghapus volumenya: `sai-accounting_db_data` tetap di cakram sampai
  # `docker volume rm` dijalankan tangan, sesudah dump terakhir tersalin ke luar
  # server (PRODUCTION.md §MariaDB retired).
  documents:
  audit:
  # Data PostgreSQL, mesin kanonik sejak 15 Okt 2026 (dulu dideklarasikan lebih
  # awal, saat `pg` masih di belakang profile, supaya penukaran tidak perlu
  # menyentuh daftar volume: satu-satunya bagian compose yang kesalahannya
  # membuat data yatim).
  pg_data:
  # Artefak cadangan terenkripsi saat `BACKUP_S3_BUCKET` belum disetel. Volume
  # BERNAMA, bukan bind mount ke pohon repo: ia harus bertahan melewati
  # `docker compose down` dan tidak boleh ikut masuk ke konteks build — satu
  # dump produksi pernah terpanggang ke dalam image yang digelar karena
  # `backups/` di pohon repo (lihat .dockerignore §anchor).
  cadangan:
  # Hasil pekerjaan (`result_ref`): ekspor laporan & dokumen yang dihasilkan
  # jalur antrean, lalu diunduh pengguna lewat route handler ber-izin.
  #
  # ⚠ Volume BERNAMA dan bukan bind mount, alasan yang sama dengan `cadangan`
  # di atas: isinya buku besar PT sungguhan, dan direktori runtime di pohon repo
  # bisa ikut terpanggang ke dalam image (lihat .dockerignore §anchor).
  #
  # Penulisnya pelari jalur `interactive`: peran `interactive` di `svc-worker`
  # (Node, tahap 1c) dan `svc-integrator` (Go, tahap 1d). Pembacanya
  # `app-customer` (`:ro`), sebagai `node` — dan sejak Okt 2026 kedua penulis
  # juga uid 1000, jadi berkasnya lahir milik pembacanya. Pemilik lain = berkas
  # 0600 dijawab 404 oleh rute unduhan (`chown` di penulis hanya bila ia root).
  hasil:
