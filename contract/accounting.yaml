# ═══════════════════════════════════════════════════════════════════════════
# KONTRAK AKUNTANSI — konstanta yang dibaca DUA bahasa (09 §3.5, tahap 1d)
#
# Dari sini dibangkitkan (`bun run contract:gen`):
#   • TypeScript → packages/core/src/generated/accounting.ts
#   • Go         → services/integrator/internal/contract/accounting_gen.go
#
# ══ YANG BOLEH MASUK: HANYA YANG PUNYA PEMBACA GO HARI INI ═════════════════
# Kontrak yang dibangkitkan untuk nol pembaca adalah berkas yang menyimpang
# tanpa ada yang menyadarinya — ia tidak punya sisi kedua yang bisa
# membantahnya (09 §3.5). Jadi isi berkas ini mengikuti laporan yang SUDAH
# pindah ke Go, bukan rencana:
#
#   • `money.scale`   — dibaca `internal/ledgerread` (urai NUMERIC jadi sen
#                       bilangan bulat) dan `src/lib/reports.ts` (cek seimbang
#                       Neraca Saldo pada ketelitian sen).
#   • `account_types` — dibaca `internal/ledgerread` (akun bertipe asing di
#                       Neraca Saldo dilaporkan, bukan ditelan) dan
#                       `src/lib/accounting.ts` (daftar tipe akun aplikasi).
#
#   • `account_categories` + `account_type_categories` — dibaca Laba Rugi dan
#                       Neraca Go (`internal/ledgerread/statements.go`) dan
#                       `src/lib/accounting.ts` (`accountCategoryFor`).
#   • `category_statement_side` — sisi yang dilaporkan POSITIF per kategori di
#                       Laba Rugi & Neraca; dibaca kedua sisi (`reports.ts`).
#   • `income_statement` — band Laba Rugi bertingkat (#123); dibaca
#                       `incomeStatementSectionFor` dan Laba Rugi Go.
#   • `closing_journal_type` — jenis jurnal penutup tahunan (#555) yang DIBUANG
#                       Laba Rugi; dibaca `year-close.ts` dan Laba Rugi Go.
#   • `cash_flow`     — akun kas & kelompok arus kas per tipe akun lawan;
#                       dibaca `getCashFlow` (`reports.ts`) dan Arus Kas Go
#                       (`internal/ledgerread/cash_flow.go`).
#
#   • `currencies`, `invoice_statuses`, `contract_statuses` — PENGECUALIAN
#                       yang DISEBUT dari aturan di atas: dibangkitkan atas
#                       keputusan pemilik (23 Okt 2026) SEBELUM pembaca Go
#                       pertamanya ada, supaya pemeriksa kesesuaian data &
#                       materialitas yang kelak pindah ke Go mewarisi kosakata
#                       yang sama dengan zod — bukan salinan ketiga. Pembaca TS
#                       hari ini: `packages/core/src/constants.ts` (re-ekspor),
#                       zod `validations/{contract,invoice,fx}.ts`, dan
#                       `scripts/check-data-conformance.ts`. Daftar
#                       pengecualiannya di `tests/contract-accounting.test.ts`;
#                       pembaca Go pertama MENCORETNYA dari sana.
#                       ✅ `currencies` sudah dicoret (23 Okt 2026): Arus Kas
#                       Go membaca `BaseCurrency` untuk baris valas berkurs 1.
#                       ✅ `invoice_statuses` & `contract_statuses` dicoret
#                       bersama Umur Piutang/Utang (`internal/ledgerread/aging.go`,
#                       status "dibatalkan") — daftar pengecualiannya kini kosong.
#
#   • `aging`         — ember Umur Piutang & Umur Utang (#12); dibaca
#                       `src/lib/receivables.ts` (`agingBucket`) dan
#                       `internal/ledgerread/aging.go`.
#
#   • `materiality`   — pagar materialitas akun penampung beban (#444/#445);
#                       dibaca `src/lib/materiality.ts` (sapuan kesesuaian
#                       Node, laporan sifat beban) dan
#                       `internal/conformance/materiality.go` (sapuan
#                       kesesuaian Go, jalur `tenant`, 23 Okt 2026).
#
# Yang SENGAJA BELUM ada: saldo normal per tipe. Tidak satu pun pembaca Go
# membacanya —
# saldo normal hanya dibaca formulir bagan akun & buku besar (TS), dan
# `accumulated_depreciation` membuktikan ia BUKAN turunan kategori (aset,
# saldo normal kredit). Laba Rugi & Neraca memakai sisi KATEGORI, bukan sisi
# normal tipe: akumulasi penyusutan tampil NEGATIF di blok aset (kontra-aset),
# bukan positif di sisi lain.
#
# ══ MENGUBAH ═══════════════════════════════════════════════════════════════
#   1. ubah di bawah;
#   2. `bun run contract:gen`;
#   3. commit berkas bangkitannya bersama perubahan ini — `contract:gen --cek`
#      (dipanggil `tests/contract-accounting.test.ts`) menolak yang basi.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

money:
  # Skala kolom uang `Decimal(15,2)` (docs/DATABASE.md). Satu SEN adalah
  # 10^-scale rupiah; kedua bahasa membandingkan uang pada ketelitian ini.
  scale: 2

# ── Tipe akun ──────────────────────────────────────────────────────────────
# URUTANNYA BERMAKNA: ini urutan pilihan di formulir bagan akun, dan entri
# pertama adalah bawaannya. Label, kategori, dan saldo normal tetap di
# `src/lib/accounting.ts`, dipetakan per nilai lewat `Record<AccountType, …>`
# — tipe baru di sini yang lupa diberi label di sana adalah galat `tsc`.
account_types:
  - cash_bank
  - account_receivable
  - inventory
  - other_current_asset
  - fixed_asset
  - accumulated_depreciation
  - other_asset
  - account_payable
  - tax_payable
  - other_current_liability
  - long_term_liability
  - equity
  - revenue
  - other_income
  - cogs
  - expense
  - other_expense

# ── Kategori akun ──────────────────────────────────────────────────────────
# Lima kategori laporan keuangan. Tipe akun yang TIDAK punya kategori (nilai
# basis data di luar kontrak) tidak masuk Laba Rugi maupun Neraca di KEDUA
# bahasa — Neraca Saldo tetap menghitungnya (lihat `unknownTypes` Go).
account_categories:
  - asset
  - liability
  - equity
  - revenue
  - expense

# Setiap tipe di `account_types` tepat SATU kategori — generator menolak tipe
# tanpa kategori, kategori asing, dan kunci yang bukan tipe.
account_type_categories:
  cash_bank: asset
  account_receivable: asset
  inventory: asset
  other_current_asset: asset
  fixed_asset: asset
  accumulated_depreciation: asset
  other_asset: asset
  account_payable: liability
  tax_payable: liability
  other_current_liability: liability
  long_term_liability: liability
  equity: equity
  revenue: revenue
  other_income: revenue
  cogs: expense
  expense: expense
  other_expense: expense

# Sisi saldo yang dilaporkan POSITIF di Laba Rugi dan Neraca, per KATEGORI:
# `debit` = debit − kredit, `credit` = kredit − debit. Per kategori, bukan per
# tipe — itu yang membuat Retur Penjualan menetralkan dirinya di pendapatan dan
# Akumulasi Penyusutan tampil negatif di aset.
category_statement_side:
  asset: debit
  liability: credit
  equity: credit
  revenue: credit
  expense: debit

# ── Laba Rugi bertingkat (#123) ────────────────────────────────────────────
# Penjualan − HPP = Laba Kotor, − Beban Operasional = Laba Usaha, ± lain-lain
# = Laba Bersih. Urutan `sections` = urutan band di laporan.
#
# Aturannya TOTAL atas akun laba rugi: tipe di `type_sections` mendapat band
# sendiri, SISANYA jatuh ke band bawaan kategorinya. Tipe pendapatan/beban
# yang ditambahkan kelak karena itu tetap mendarat di band yang terlihat —
# bukan hilang dari rincian sambil tetap terjumlah di total.
income_statement:
  sections:
    - sales
    - cogs
    - operating_expense
    - other_income
    - other_expense
  type_sections:
    other_income: other_income
    cogs: cogs
    other_expense: other_expense
  category_default_sections:
    revenue: sales
    expense: operating_expense

# ── Tutup buku tahunan (#555) ──────────────────────────────────────────────
# `journals.type` jurnal penutup. Laba Rugi MEMBUANGNYA (tanpanya tahun yang
# baru ditutup melaporkan laba NOL); Neraca dan Neraca Saldo MEMASUKKANNYA —
# di situlah Laba Ditahan memperoleh saldonya.
closing_journal_type: closing

# ── Arus Kas (PSAK 2 / IAS 7, metode langsung) ────────────────────────────
# Dibaca `getCashFlow` (`src/lib/reports.ts`) dan Arus Kas Go
# (`internal/ledgerread/cash_flow.go`, tahap 1d).
#
#   • `cash_account_type` — sisi KAS buku: gerakan menjadi arus kas hanya bila
#     ia menyeberangi batas akun bertipe ini.
#   • `categories` — urutan kelompok di laporan. `fallback_category` WAJIB
#     salah satunya: tipe yang tidak dipetakan (tipe kontrak baru yang lupa
#     dipetakan, atau tipe asing di basis data) mendarat di kelompok yang
#     TERLIHAT, bukan dilipat diam-diam ke operasi.
#   • `type_categories` — kelompok arus kas per tipe AKUN LAWAN (sisi lain
#     jurnal), bukan per akun kas itu sendiri. Sengaja TIDAK wajib lengkap:
#     itulah gunanya `fallback_category`. Generator menolak tipe yang tidak
#     ada di `account_types`, kelompok asing, dan pemetaan ke kelompok
#     cadangan (yang hanya boleh dicapai karena TIDAK dipetakan).
cash_flow:
  cash_account_type: cash_bank
  categories:
    - operating
    - investing
    - financing
    - uncategorised
  fallback_category: uncategorised
  type_categories:
    # Operasi — siklus dagang …
    revenue: operating
    other_income: operating
    cogs: operating
    expense: operating
    other_expense: operating
    # … dan modal kerjanya (waktu dari siklus yang sama).
    account_receivable: operating
    account_payable: operating
    inventory: operating
    tax_payable: operating
    other_current_asset: operating
    other_current_liability: operating
    # Investasi — aset tidak lancar.
    fixed_asset: investing
    accumulated_depreciation: investing
    other_asset: investing
    # Pendanaan — cara usaha dibiayai.
    equity: financing
    long_term_liability: financing

# ── Mata uang ──────────────────────────────────────────────────────────────
# Kode ISO 4217 (tiga huruf besar) yang ditransaksikan aplikasi. URUTANNYA
# BERMAKNA: urutan pilihan formulir. `base` = mata uang buku besar — setiap
# `base_amount` dinyatakan dalam mata uang ini, dan ia wajib salah satu
# `values`. Kode lain di data (mis. `LC` warisan — cara bayar, bukan mata uang)
# adalah temuan `check-data-conformance`, bukan anggota daftar ini.
currencies:
  base: IDR
  values:
    - USD
    - CNY
    - IDR

# ── Status dokumen ─────────────────────────────────────────────────────────
# Faktur: tiga nilai. Kontrak: tiga nilai yang SAMA, dalam urutan yang sama,
# ditambah `completed` (disahkan pemilik 23 Okt 2026 — kontrak yang selesai
# dijalankan; BUKAN "lunas", pelunasan tetap dihitung dari pembayaran).
#
# Generator menolak `contract_statuses` yang tidak DIAWALI `invoice_statuses`
# persis: tiga posisi pertama dipasangkan dengan nada donat status (sah →
# hijau, menunggu → kuning, dibatalkan → merah), dan label badge dibagi kedua
# dokumen — status yang bergeser posisi akan berganti warna tanpa satu galat.
# Status baru kontrak karena itu selalu DITAMBAH DI BELAKANG.
#
# Mengubah daftar ini menyentuh basis data: `contracts.status` dijaga CHECK
# constraint (migration perusahaan 0003) yang daftarnya wajib sama — dijaga
# `tests/contract-status-check.test.ts`.
invoice_statuses:
  - signed
  - pending
  - canceled
contract_statuses:
  - signed
  - pending
  - canceled
  - completed

# ── Umur piutang & utang (#12) ─────────────────────────────────────────────
# Ember umur, berurutan dari yang termuda. `max_days` = batas atas INKLUSIF
# dalam hari kalender Jakarta (umur 30 masih `b0_30`, 31 sudah `b31_60`);
# umur <= 0 (belum jatuh tempo / jatuh tempo hari ini) mendarat di ember
# PERTAMA. Ember TERAKHIR tanpa `max_days` — ia menampung sisanya. Generator
# menolak batas yang tidak naik tegas, ember tanpa batas di tengah, dan ember
# terakhir yang berbatas: umur yang tidak masuk ember mana pun adalah piutang
# yang hilang dari ringkasan di satu bahasa dan tidak di bahasa lain.
#
# Label tampilannya ("0–30 hari") tetap di `src/lib/receivables.ts` dan sampai
# ke Go lewat `report_layout`-nya, bukan dari sini.
aging:
  buckets:
    - key: b0_30
      max_days: 30
    - key: b31_60
      max_days: 60
    - key: b61_90
      max_days: 90
    - key: b90_plus

# ── Pagar materialitas akun penampung beban (#444, #445) ──────────────────
# Dibaca DUA pemeriksa kesesuaian data — `scripts/check-data-conformance.ts`
# (lewat `src/lib/materiality.ts`) dan `internal/conformance` (Go, jalur
# `tenant`) — dan keduanya wajib menuduh akun yang SAMA dengan kalimat yang
# SAMA: pemeriksa yang berpindah bahasa lalu berbunyi untuk akun lain adalah
# pemeriksa yang tidak lagi dipercaya siapa pun.
#
#   • `catch_all_threshold` — pangsa minimum terhadap TOTAL beban yang disebut
#     material, 0..1 EKSKLUSIF (pangsa yang tepat sama dengan ambang BELUM
#     material). Ambang PRAKTIK, bukan angka peraturan; alasannya di kepala
#     `src/lib/materiality.ts`. Ditimpa per putaran lewat
#     `--ambang-penampung=<persen>` (Node) atau muatan `ambangPenampung`
#     pekerjaan `tenant.conformance` (Go) — nilai di sini hanya BAWAANNYA.
#   • `catch_all_expense_type` — tipe band "Beban Lain-lain" (temuan `band`).
#     Generator menolak tipe yang tidak ada di `account_types` atau yang
#     kategorinya bukan `expense`. Labelnya TIDAK di sini: ia label tipe akun
#     milik `src/lib/accounting.ts`, dan sampai ke Go lewat bangkitan.
#   • `catch_all_name_pattern` — nama yang menyatakan dirinya penampung.
#     Dicocokkan TANPA membedakan huruf besar-kecil — hanya huruf ASCII, sama
#     seperti bendera `i` RegExp JS tanpa `u`. Generator menolak huruf besar
#     ASCII di polanya (pembanding Go menurunkan huruf ASCII namanya lalu
#     mencocokkan tanpa `(?i)`, sebab `(?i)` RE2 melipat Unicode — `K` Kelvin,
#     `ſ` panjang — dan JS tidak) serta escape selain `\s` `\b` `\d` `\w`.
#     `\s` diterjemahkan generator ke kelas spasi JS yang PERSIS (termasuk
#     NBSP — nama akun yang ditempel dari lembar sebar sering membawanya);
#     `\s` RE2 hanya spasi ASCII.
materiality:
  catch_all_threshold: 0.05
  catch_all_expense_type: other_expense
  catch_all_name_pattern: '(lain[-\s]?lain|lainnya|serba[-\s]?serbi|\bdll\b|\bdsb\b|miscellaneous|\bmisc\b|\bsundry\b|\bother\b|\bothers\b)'
