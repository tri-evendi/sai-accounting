# SAI Accounting — fronted by Traefik (same convention as movin-partner /
# wedding-movin). Traefik terminates TLS and routes ${APP_DOMAIN} to
# app-customer and ${OPERATOR_DOMAIN} to app-operator over the shared external
# `traefik` network; neither app is published on the host directly. PostgreSQL (`pg`, via `pgbouncer`) + one-shot Prisma migrations
# run on a private network. `db` (MariaDB) is a read-only fallback until #636.
#
# Images are built by CI and pulled from GHCR; never build on the server.
# Release steps: PRODUCTION.md §Updates.
#
# `.env` is auto-loaded by Compose for the ${...} interpolation below and
# injected at run time via env_file. Requires an existing Traefik instance
# attached to the external `traefik_default` network with a `le` cert resolver.

services:
  db:
    image: mariadb:11
    container_name: sai-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sai_production}
      MARIADB_USER: ${DB_USER:-sai}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  # ══ PostgreSQL — MESIN UTAMA sejak 15 Okt 2026 ═════════════════════════════
  #
  # Keduanya kini service BAWAAN — `profiles:` dicabut 15 Okt 2026 saat
  # PostgreSQL menjadi mesin kanonik. Skema Prisma memakai
  # `provider = "postgresql"`, jadi klien yang dibangkitkan hanya bisa bicara ke
  # mesin ini; menjadikannya opsional berarti aplikasi yang naik tanpa basis
  # data sama sekali.
  #
  # ⚠ `db` (MariaDB) SENGAJA MASIH HIDUP, dan itu bukan kelalaian: ia jalan
  # mundur selama jendela transisi. Datanya tidak ditulisi siapa pun sejak
  # penukaran — aplikasi hanya bicara ke `pgbouncer`. Mencabutnya adalah langkah
  # terpisah yang dilakukan setelah beberapa hari tenang, dan dengan dump
  # terakhir disimpan di luar mesin ini lebih dulu.
  #
  # Jalan mundurnya BUKAN sekadar menukar URL: image yang dibangun dari skema
  # PostgreSQL tidak bisa memakai `mysql://`. Kembali berarti menggelar image
  # lama (tag `sha-` di GHCR) DAN menukar URL. Lihat
  # docs/arsitektur/07-RIWAYAT.md
  pg:
    # ⚠ Versi mayor di sini HARUS sejajar dengan `postgresql-client-17` di
    # `Dockerfile` tahap `backup`. `pg_dump` menolak server yang lebih baru
    # daripada dirinya — terukur: klien 15 menolak server 17.11 dengan
    # "aborting because of server version mismatch". Dijaga
    # `tests/pg-client-version.test.ts`.
    image: postgres:17-alpine
    container_name: sai-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-sai}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
      POSTGRES_DB: postgres
      TZ: ${TZ:-Asia/Jakarta}
      # `--data-checksums` TIDAK bisa dinyalakan setelah inisialisasi. Satu-satunya
      # kesempatan memasangnya adalah sekarang, dan tanpa itu kerusakan halaman
      # cakram terbaca sebagai data yang sah.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sai} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  # ══ PgBouncer — WAJIB, bukan penyetelan ═══════════════════════════════════
  #
  # MariaDB memakai THREAD per koneksi; PostgreSQL memakai PROSES. Puncak koneksi
  # di kotak ini TERUKUR 62 (`MAX_USED_CONNECTIONS`), dan 62 proses backend pada
  # mesin 3,6 GB yang dibagi lima aplikasi lain bukan hal sepele.
  #
  # Dan pola klien per-perusahaan memperbesarnya: jumlah koneksi tumbuh mengikuti
  # jumlah BUKU yang aktif bersamaan, bukan jumlah pengguna.
  #
  # `transaction` pooling, bukan `session`: dengan `session` satu koneksi aplikasi
  # memegang satu backend selama hidupnya, dan seluruh manfaatnya hilang.
  # ⚠ Konsekuensinya nyata — `transaction` mode TIDAK mendukung pernyataan
  # bersiap lintas-transaksi. Prisma 7 memakai driver adapter, jadi ini aman,
  # TETAPI menukar mode ke `session` kelak akan mengembalikan soal memori yang
  # justru hendak dipecahkan di sini.
  pgbouncer:
    # VERSI DIPATOK, bukan `latest` (celah on-premise #8). `latest` bergerak
    # tanpa pemberitahuan — dan digest-nya bahkan tidak sama dengan versi
    # bertag mana pun, jadi pemasangan yang menariknya menjalankan pooler yang
    # tidak bisa disebut namanya. Menaikkannya adalah langkah sadar satu baris.
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: sai-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_USER: ${PG_USER:-sai}
      DB_PASSWORD: ${PG_PASSWORD:-}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-migrate
    env_file: .env
    # ══ MIGRATE MENYAMBUNG LANGSUNG KE `pg`, MELEWATI PgBouncer ═════════════
    #
    # Bukan pilihan gaya — Prisma Migrate memakai `pg_advisory_lock` untuk
    # memastikan hanya satu proses memigrasikan satu basis data pada satu saat.
    # Advisory lock terikat SESI, sedangkan PgBouncer `transaction` pooling
    # memberi backend yang BERBEDA tiap transaksi. Jadi kunci diambil di satu
    # backend lalu dilepas bersama transaksinya, dan percobaan berikutnya
    # menunggu kunci yang tidak pernah ada pemiliknya:
    #
    #   Error: P1002 — Timed out trying to acquire a postgres advisory lock
    #   (SELECT pg_advisory_lock(72707369)). Timeout: 10000ms.
    #
    # Terukur di penukaran 15 Okt 2026. `environment:` menimpa `env_file:`,
    # jadi tiga baris di bawah ini mengalahkan URL PgBouncer di `.env` — dan
    # HANYA untuk service ini. Aplikasi tetap lewat PgBouncer, yang memang
    # alasan PgBouncer ada.
    #
    # `DATABASE_URL` juga menjadi TEMPLATE untuk 17 buku PT
    # (`migrate-all-companies.ts` mengganti nama basis datanya), jadi satu baris
    # ini membuat seluruh buku ikut dimigrasikan lewat koneksi langsung.
    environment:
      DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/${DB_NAME:-sai_production}
      CONTROL_DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/sai_control
      PLATFORM_DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/sai_platform
    restart: "no"
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - internal

  # ── PENJADWAL LANGGANAN (issue #373) ──────────────────────────────────────
  # Trial berakhir, tagihan terbit, dunning, suspensi, pengingat H-7/H-3/H-1.
  #
  # ⚠ KENAPA LAYANAN, BUKAN CRON HOST. Sampai #373 ini sebaris crontab yang
  # dipasang tangan — dan TIDAK ADA APA PUN yang memeriksa baris itu ada. Kalau
  # ia terlewat saat rilis, atau hilang karena server dibangun ulang, yang
  # terjadi adalah: uji coba tidak pernah berakhir, tagihan pertama tidak pernah
  # terbit, penunggak tidak pernah ditangguhkan — SEMUANYA tanpa satu pun galat,
  # tanpa halaman rusak, tanpa log merah. Terlihat persis seperti sistem sehat,
  # sampai seseorang membuka laporan pendapatan dan bertanya kenapa nol.
  #
  # Sebagai layanan ia LAHIR BERSAMA DEPLOY: tidak ada langkah manual yang bisa
  # terlewat, dan `docker compose ps` memperlihatkan keberadaannya.
  #
  # Image `migrator` dipakai ulang — env & node_modules yang sama, dan
  # satu-satunya cara menjangkau service `db` yang tidak memublikasikan port
  # (alasan yang sama dengan migration; docs/MULTI-COMPANY.md §3).
  #
  # `|| true` disengaja: satu putaran yang gagal TIDAK BOLEH mematikan
  # putaran-putaran berikutnya. Skripnya idempoten, jadi putaran berikutnya
  # menyembuhkan yang tertinggal — sedangkan loop yang mati karena satu galat
  # mengembalikan kita persis ke kegagalan senyap yang layanan ini tutup.
  # Kegagalannya tetap terbaca: tercatat di `scheduler_runs` (status `error`),
  # tampil di konsol `/scheduler`, dan terbaca `prove-scheduler-alive`.
  #
  # Tidur 3600 detik, BUKAN cron di dalam container: satu proses shell yang
  # tidur tidak memakan apa pun, dan menambah daemon cron ke image berarti satu
  # hal lagi yang bisa mati diam-diam di kotak yang sudah padat.
  job-scheduler:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-job-scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    command:
      - sh
      - -c
      # `notify:setup`, `notify:invoice-due`, dan `remind:customers` menumpang
      # putaran yang SAMA, bukan layanan sendiri-sendiri: cadensinya identik
      # (per jam), semuanya membaca daftar perusahaan yang sama, dan semuanya
      # idempoten (`dedupe_key`, atau kunci unik pengingat). Layanan tersendiri
      # hanya akan menambah container yang bisa mati diam-diam di kotak yang
      # sudah padat.
      #
      # `remind:customers` ditaruh TERAKHIR dengan sengaja (issue #467): ia
      # satu-satunya mata rantai yang mengirim surel KE LUAR, dan menempatkannya
      # di belakang berarti putaran yang mati di tengah gagal pada pekerjaan
      # yang masih bisa diulang tanpa konsekuensi ke orang lain.
      #
      # `prune:trails` ditaruh PALING AKHIR, dan bukan karena ia paling tidak
      # penting: ia satu-satunya mata rantai yang MENGHAPUS. Menempatkannya di
      # belakang berarti putaran yang mati di tengah berhenti pada pekerjaan
      # yang masih bisa diulang — bukan pada satu-satunya yang tidak punya
      # langkah balik. Alasan yang sama yang menaruh `remind:customers` di
      # belakang, hanya dengan risiko yang berbeda bentuknya.
      #
      # Per jam jauh lebih sering daripada yang dibutuhkan ambang 90 hari, dan
      # itu disengaja: putaran yang tidak menemukan apa pun berhenti pada satu
      # `SELECT` per tabel — lebih murah daripada satu cadensi lagi yang harus
      # dijaga seseorang.
      #
      # `|| true` di tiap mata rantai disengaja: satu produser yang gagal tidak
      # boleh menelan yang berikutnya — putarannya harus tetap sampai `sleep`.
      #
      # ⚠ `|| true` TIDAK cukup, dan itu terbukti di produksi 30 Agu 2026.
      # Ia melindungi dari langkah yang GAGAL, bukan dari yang MENGGANTUNG:
      # `scheduler:subscriptions` menggantung dua jam dengan CPU 0,09%, putaran
      # itu tak pernah sampai ke `sleep`, dan SELURUH putaran berikutnya
      # tertahan selamanya. Gejalanya menyesatkan — container "Up", log
      # terakhir "✓ selesai tanpa masalah", nol galat di mana pun; yang
      # menyingkapkannya cuma `/api/health` → `scheduler: late` dan
      # `docker top`.
      #
      # Karena itu tiap langkah dibungkus `timeout`, dan batasnya DITURUNKAN
      # setiap kali satu langkah ditambahkan. Aturannya satu: **jumlah langkah ×
      # batas harus tetap di bawah selang putarannya (3600s)**, supaya putaran
      # terburuk sekalipun tidak menumpuk lebih dari satu.
      #
      #   5 langkah × 600s = 50 menit   (sebelum `prune:trails`)
      #   6 langkah × 600s = 60 menit   (tepat di batas — nol ruang sisa)
      #   7 langkah × 480s = 56 menit   (setelah `watch:health` ikut)
      #   8 langkah × 420s = 56 menit   ← sekarang, setelah `backup:publish` ikut
      #
      # ⚠ `recurring:run` menjadi `recurring:publish` (rancangan §4), dan BATAS
      # tidak diturunkan karena jumlah langkah tidak berubah. Yang berubah lebih
      # dalam daripada namanya: langkah itu berhenti MELAKSANAKAN. Ia kini
      # menulis satu baris `jobs` per PT dan selesai dalam milidetik, dan yang
      # memposting dokumen berulang adalah `svc-ledger`. Perhitungan di atas
      # memang dibuat terhadap langkah yang melaksanakan, jadi satu langkah yang
      # keluar dari perhitungan itu adalah ruang yang bertambah, bukan berkurang.
      #
      # `watch:backup` menjadi `watch:health` 12 Okt 2026 — ia kini memeriksa
      # TIGA denyut (cadangan, penjadwal, kesesuaian) dalam satu langkah. Jumlah
      # langkah TIDAK bertambah, jadi BATAS tidak perlu turun lagi.
      #
      # `prune:trails` TETAP paling akhir, dan `watch:backup` disisipkan SEBELUM
      # ia — bukan sesudahnya. Alasannya bukan selera: `prune:trails` satu-satunya
      # langkah yang MENGHAPUS, dan putaran yang mati di tengah harus berhenti
      # pada pekerjaan yang masih bisa diulang, bukan pada satu-satunya yang tak
      # punya langkah balik. Dijaga `tests/run-trail-retention.test.ts`.
      #
      # ⚠ `backup:publish` adalah langkah KEDELAPAN, dan BATAS diturunkan
      # 480 → 420 karena itu. Aturannya aritmetika, bukan selera, dan
      # `tests/scheduler-heartbeat.test.ts` menghitungnya: 8 × 420 = 3.360s,
      # masih di bawah selang 3.600s.
      #
      # Ia BISA diperdebatkan — langkah ini menerbitkan satu baris `jobs` dan
      # selesai dalam milidetik, sama seperti `recurring:publish`, jadi dua dari
      # delapan langkah sekarang praktis nol. Tapi aturan di atas ditulis sebagai
      # aritmetika justru supaya ia tidak perlu bergantung pada penalaran tentang
      # langkah mana yang cepat: penalaran itu benar hari ini dan akan salah pada
      # hari seseorang menukar isi sebuah langkah tanpa menukar namanya.
      #
      # Peringatan yang sama berlaku untuk langkah KESEMBILAN. `-k 30`
      # mengirim KILL 30 detik setelah TERM untuk proses yang membandel —
      # Prisma yang menahan event loop tidak selalu pergi karena TERM saja.
      #
      # Yang dibunuh BERBUNYI di log beserta nama langkahnya. Timeout yang
      # diam adalah cacat yang sama dengan `|| true` yang diam: pekerjaan
      # berhenti dikerjakan tanpa ada yang tahu.
      - |
        langkah() {
          nama="$$1"; shift
          timeout -k 30 "$$BATAS" "$$@"
          kode=$$?
          if [ "$$kode" = 124 ] || [ "$$kode" = 137 ]; then
            echo "[penjadwal] ⏱ '$$nama' DIBUNUH setelah $${BATAS}s — putaran lanjut."
          elif [ "$$kode" != 0 ]; then
            echo "[penjadwal] ✗ '$$nama' gagal (kode $$kode) — putaran lanjut."
          fi
          return 0
        }
        BATAS=420
        while true; do
          langkah scheduler:subscriptions bun run scheduler:subscriptions
          langkah notify:setup bun run notify:setup
          langkah notify:invoice-due bun run notify:invoice-due
          langkah remind:customers bun run remind:customers
          langkah recurring:publish bun run recurring:publish
          langkah backup:publish bun run backup:publish
          langkah watch:health bun run watch:health
          langkah prune:trails bun run prune:trails
          sleep 3600
        done

  # ── PEMERIKSA KESESUAIAN DATA (mingguan) ──────────────────────────────────
  # Penjaga zod hanya berlaku di jalur TULIS. Impor sekali-jalan, perbaikan SQL
  # manual, dan penyemai tidak melewati satu penjaga pun — dan audit 20-21
  # Agustus 2026 menemukan ENAM kelas cacat yang masuk lewat pintu itu di buku
  # produksi: status kontrak di luar enum, mata uang `LC`, 609 kontrak valas
  # tanpa kurs, 720 pembayaran salah label mata uang, faktur kelebihan bayar,
  # dan kuantitas faktur yang termigrasi salah senilai Rp 774 juta.
  #
  # Semuanya ditemukan dengan menggali manual selama dua hari. Layanan ini ada
  # supaya penggalian itu tidak perlu terulang.
  #
  # MINGGUAN, bukan sejam sekali seperti `scheduler`: yang dicarinya bergeser
  # lambat. Cacat seperti ini lahir dari peristiwa jarang — impor sistem lama,
  # perbaikan tangan — bukan dari lalu lintas harian. Memeriksanya tiap jam
  # hanya memindahkan beban tanpa menemukan apa pun lebih cepat.
  #
  # LAYANAN SENDIRI, bukan disisipkan ke `job-scheduler`: cadensinya berbeda, dan
  # yang lebih penting — kegagalan penagihan dan temuan kesesuaian data adalah
  # dua kabar berbeda yang tidak boleh bercampur di satu aliran log.
  #
  # `|| true` dengan alasan yang sama seperti tetangganya: skrip ini SENGAJA
  # keluar bukan-nol saat menemukan sesuatu (supaya berguna di CI), dan tanpa
  # penjaga itu setiap temuan akan membuat container mati lalu dihidupkan ulang
  # tanpa henti — temuan berubah jadi crash-loop.
  #
  # Membacanya ADA DUA, dan yang kedua baru:
  #   • `docker compose logs job-conformance --tail 60` — rincian lengkapnya;
  #   • `/api/health` → `conformance` — PUTUSAN denyutnya (ok | findings | late
  #     | unknown) beserta jumlah temuan terakhir, dari tabel `conformance_runs`
  #     (migration platform 0018).
  #
  # Yang kedua ada karena yang pertama saja sudah terbukti tidak cukup: pada
  # cadensi MINGGUAN, temuan yang hanya hidup di log container bisa berumur
  # berbulan-bulan sebelum ada yang membukanya. Dua layanan latar lain
  # (`job-scheduler`, `job-backup`) sudah punya jejak yang bisa DITANYAI; yang
  # ini dulu satu-satunya yang tidak.
  #
  # Putaran pertama jalan SAAT layanan naik, bukan tujuh hari kemudian,
  # sehingga rilis yang merusak data ketahuan di hari yang sama.
  #
  # Ia tidak mengubah satu angka akuntansi pun: buku PT hanya DIBACA, dan
  # satu-satunya tulisannya adalah satu baris jejak ke basis data PLATFORM.
  # Dijaga `tests/check-data-conformance.test.ts`, yang kini menuntut sifat itu
  # secara presisi — bukan sekadar ketiadaan kata SQL.
  job-conformance:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-job-conformance
    restart: unless-stopped
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    command:
      - sh
      - -c
      # Tanggalnya dicetak sebagai perintah TERSENDIRI, bukan `$(date)` di dalam
      # string: compose menafsirkan `$` sebagai interpolasi variabelnya sendiri,
      # dan aturan pelolosannya adalah hal yang tidak perlu ditebak-tebak untuk
      # sekadar sebuah stempel waktu.
      # `timeout` dengan alasan yang sama dengan penjadwal: pemeriksaan yang
      # menggantung menahan pemeriksaan MINGGU-MINGGU berikutnya, dan pada
      # cadensi mingguan cacat itu bisa berumur berbulan-bulan sebelum ada yang
      # menyadarinya. 1800 detik longgar untuk pemeriksaan yang menyapu seluruh
      # buku setiap perusahaan.
      - |
        while true; do
          echo '── kesesuaian data ──'
          date -Iseconds
          timeout -k 30 1800 bun run check-data-conformance
          kode=$$?
          [ "$$kode" = 124 ] || [ "$$kode" = 137 ] \
            && echo "[kesesuaian] ⏱ DIBUNUH setelah 1800s — dicoba lagi minggu depan."
          sleep 604800
        done

  # ── CADANGAN (issue #374) ─────────────────────────────────────────────────
  # Menjual langganan atas pembukuan yang WAJIB disimpan sepuluh tahun (UU KUP)
  # tanpa cadangan otomatis bukan risiko teknis, melainkan risiko hukum.
  #
  # Ia butuh volume yang SAMA dengan `web` — tapi HANYA-BACA (`:ro`): layanan
  # yang tugasnya menyalin tidak punya satu alasan pun untuk bisa menulis, dan
  # bendera itu menghapus seluruh kelas kecelakaan di mana skrip cadangan justru
  # merusak yang dicadangkannya.
  #
  # Sekali sehari, bukan sejam sekali: dump seluruh basis data + berkas adalah
  # pekerjaan berat di kotak ini, dan RPO satu hari adalah janji yang jujur untuk
  # skala sekarang. Menaikkannya berarti menaikkan ongkosnya juga — putuskan
  # sadar-sadar, jangan diam-diam.
  job-backup:
    build:
      context: .
      target: backup
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-backup:${SAI_TAG:-latest}
    container_name: sai-job-backup
    # `"no"`, bukan `unless-stopped`: perintahnya kini satu penjelasan yang
    # keluar dengan kode 0 (lihat di bawah), dan `unless-stopped` atas perintah
    # yang berakhir adalah crash-loop yang mengisi log tanpa mengerjakan apa pun.
    restart: "no"
    env_file: .env
    # ══ CADANGAN MENYAMBUNG LANGSUNG KE `pg`, MELEWATI PgBouncer ═══════════
    #
    # `pg_dumpall` harus MENDAFTAR seluruh basis data lebih dulu (`pg_database`)
    # lalu menyambung ke tiap-tiap basis data itu satu per satu. PgBouncer hanya
    # mengekspos basis data yang terdaftar di konfigurasinya, jadi lewat pooler
    # dump "seluruh basis data" akan memulangkan sebagian — dan sebagian itulah
    # bentuk cadangan yang paling berbahaya: ia ADA, ia tampak berhasil, dan ia
    # baru ketahuan kurang pada hari pemulihan.
    #
    # `scripts/backup.sh` menurunkan host, port, peran, dan sandi dari URL ini,
    # jadi satu baris mengatur keempatnya sekaligus.
    environment:
      DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/${DB_NAME:-sai_production}
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    volumes:
      - documents:/app/data/documents:ro
      - audit:/app/data/audit:ro
      # ⚠ SATU-SATUNYA mount yang bisa DITULIS layanan ini, dan hanya untuk
      # hasilnya sendiri. Dipakai ketika `BACKUP_S3_BUCKET` belum disetel:
      # artefak terenkripsi mendarat di sini alih-alih tidak dibuat sama sekali.
      # Dua mount di atas TETAP `:ro` — yang dicadangkan tidak boleh bisa
      # dirusak oleh yang mencadangkannya.
      - cadangan:/app/data/cadangan
    networks:
      - internal
    # ══ LAYANAN INI BERHENTI MENCADANGKAN (tahap 1b) ═══════════════════════
    #
    # Yang mencadangkan sekarang `svc-tenant` (Go), dan ia mencadangkan SATU
    # OBJEK PER BASIS DATA — menutup celah on-premise #5: `pg_dumpall` berarti
    # satu tenant tidak bisa dipulihkan tanpa menyentuh tenant lain, padahal
    # "pulihkan data kami saja ke keadaan Selasa" adalah permintaan biasa di
    # SaaS berbayar (§1, §6).
    #
    # ⚠ CUT-OVER, BUKAN PENAMBAHAN. Membiarkan putaran harian di bawah tetap
    # hidup berarti DUA pelaksana untuk satu pekerjaan — dan yang memisahkan
    # keduanya hanya nama berkas yang kebetulan berbeda. Dua putaran cadangan
    # yang berjalan bersamaan di kotak ini bukan redundansi, ia dua `pg_dump`
    # yang berebut IO pada mesin yang satu dumpnya saja pekerjaan berat.
    #
    # ══ KENAPA LAYANANNYA TETAP ADA ════════════════════════════════════════
    # Ia menjadi PERKAKAS, dan itu memang perannya di PRODUCTION.md sejak awal:
    #
    #   docker compose run --rm job-backup bun run prove-backup-restore
    #   docker compose run --rm job-backup sh scripts/backup.sh --dry-run
    #   docker compose run --rm job-backup ls -lh /app/data/cadangan
    #
    # Image-nya satu-satunya yang punya klien Prisma (untuk mencocokkan registry
    # PT), `openssl`, `awscli`, DAN klien MariaDB — yang terakhir supaya pembukti
    # masih bisa membaca artefak dari sebelum penukaran mesin. `svc-tenant`
    # sengaja tidak memuat semua itu.
    #
    # `profiles` membuatnya TIDAK ikut `docker compose up -d`, sementara
    # `docker compose run` tetap bisa memanggilnya. Dan `command`-nya diganti
    # menjadi penjelasan yang keluar dengan kode 0: kalau suatu hari seseorang
    # menyalakan profil ini, yang terjadi satu baris log — bukan putaran cadangan
    # kedua yang tak ada yang memintanya.
    profiles: ["perkakas"]
    command:
      - sh
      - -c
      - |
        echo "[backup] Layanan ini PERKAKAS, bukan pelaksana (tahap 1b)."
        echo "[backup] Yang mencadangkan: svc-tenant — satu objek per basis data."
        echo "[backup] Pakai: docker compose run --rm job-backup bun run prove-backup-restore"
        exit 0

  # ── JALUR `ledger` — SATU-SATUNYA PENULIS BUKU BESAR DI LATAR ──────────────
  #
  # `svc-`, bukan `job-`: ia BERJALAN TERUS menguras antrean, bukan sekali-jalan
  # lalu keluar. Tiga tetangganya di atas memang `job-` karena masing-masing
  # satu putaran yang berakhir; yang ini tidak pernah berakhir.
  #
  # ══ KENAPA LAYANAN TERSENDIRI, BUKAN SATU LANGKAH LAGI DI `job-scheduler` ══
  #
  # Karena justru ITU yang dibongkar (rancangan §4). `recurring:run` dulu satu
  # langkah di putaran penjadwal, dan bentuk itu punya tiga cacat yang tidak
  # kelihatan sampai salah satunya kejadian:
  #
  #   • satu PT yang gagal menunggu SEJAM untuk dicoba lagi, karena yang
  #     diulang adalah seluruh putaran — bukan yang gagal;
  #   • langkah itu memikul batas `timeout` putaran, dan batas itu harus
  #     diturunkan setiap kali ada langkah baru. Memposting dokumen berulang
  #     untuk SEMUA PT di bawah satu stopwatch yang menyusut adalah ongkos yang
  #     tumbuh seiring jumlah pelanggan;
  #   • putaran yang mati di tengah daftar meninggalkan separuh PT tak tergarap
  #     tanpa satu baris pun yang mencatat sampai mana ia sempat.
  #
  # Sekarang penjadwal MENERBITKAN (satu baris `jobs` per PT, selesai dalam
  # milidetik) dan layanan ini MELAKSANAKAN, dengan `attempts` dan backoff per
  # PT. Itu sekaligus menutup P2-2: tiap langkah punya barisnya sendiri.
  #
  # ⚠ SATU REPLIKA, DAN ITU BUKAN PILIHAN PENYEBARAN. Jalur ini tunggal-instans
  # di `contract/kinds.yaml`, dan pelarinya memagari diri dengan
  # `pg_try_advisory_lock`: instans kedua KELUAR tanpa bekerja alih-alih ikut
  # mengklaim. Pagar itu tidak memikul kebenaran — `dedupe_key` yang unik sudah
  # melakukannya — tapi ia mencegah kesalahan konfigurasi yang jauh lebih mudah
  # dilakukan daripada dibayangkan. Menaikkan `deploy.replicas` di sini tidak
  # akan menggandakan throughput; ia hanya menghasilkan satu container yang
  # hidup dan satu yang keluar.
  #
  # ⚠ INVARIAN I-2 ADA DI SINI, BUKAN DI DOKUMEN. Ini satu-satunya layanan latar
  # yang menulis buku besar, dan handler-nya MENDELEGASIKAN ke
  # `src/lib/recurring-run.ts` — mesin yang sama yang dipakai `recurring:run`
  # tangan. Dua mesin untuk satu aturan akuntansi akan menyimpang tanpa satu
  # galat pun, dan yang menyimpang adalah buku.
  #
  # Image `migrator`, sama seperti tiga tetangga latar lain: ia butuh sumber TS
  # dan `node_modules`, bukan keluaran `next build`.
  #
  # TANPA `timeout` pembungkus, dan itu disengaja — berbeda dari tiga tetangga
  # di atas. Yang dijaga `timeout` di sana adalah PUTARAN yang menggantung lalu
  # menahan putaran berikutnya selamanya; di sini tidak ada putaran berikutnya
  # yang bisa tertahan. Pekerjaan yang menggantung dijaga oleh LEASE: ia
  # berhenti diperpanjang, ambang reclaim melewatinya, dan barisnya pulang ke
  # `queued` dengan `attempts + 1` — mekanisme yang tahu jenis pekerjaannya,
  # yang tidak bisa dilakukan satu angka detik di compose.
  svc-ledger:
    build:
      context: .
      target: migrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-migrator:${SAI_TAG:-latest}
    container_name: sai-svc-ledger
    restart: unless-stopped
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    # `-k 30` saat berhenti: pelari menyelesaikan pekerjaan yang sedang jalan
    # lalu keluar sendiri, tapi Prisma yang menahan event loop tidak selalu
    # pergi karena TERM saja — alasan yang sama dengan `job-scheduler`.
    stop_grace_period: 60s
    command: ["bun", "run", "jobs:run:ledger"]

  # ── JALUR `tenant` — CADANGAN PER BASIS DATA (tahap 1b, §6) ────────────────
  #
  # Menggantikan putaran harian `job-backup`, dan yang berubah bukan bahasanya
  # melainkan BENTUK ARTEFAKNYA: satu objek `pg_dump -Fc` per basis data +
  # satu `pg_dumpall --globals-only` + satu manifest, bukan satu arsip raksasa.
  # Itulah yang menutup celah on-premise #5 — "pulihkan data kami saja ke
  # keadaan Selasa" bisa dijawab tanpa menyentuh tenant lain.
  #
  # `svc-`, bukan `job-`: ia BERJALAN TERUS menguras antrean, bukan sekali-jalan
  # lalu keluar. Yang menjadwalkannya `backup:publish` di putaran
  # `job-scheduler`, berbutir HARI — alasannya di `scripts/publish-backup.ts`.
  #
  # ══ SATU-SATUNYA CONTAINER YANG MEMEGANG RAHASIA CADANGAN ══════════════════
  #
  # `BACKUP_ENCRYPTION_KEY` dan kredensial S3 hidup DI SINI dan tidak di jalur
  # mana pun yang memproses masukan pengguna. Itu sebabnya ia jalur tersendiri
  # dan bukan satu handler di pelari lain.
  #
  # ⚠ `env_file: .env` memang membawa seluruh berkas, termasuk variabel yang
  # tidak dibutuhkannya. Memisahkannya menuntut berkas env kedua di mesin
  # customer, dan berkas kedua yang lupa disalin adalah kegagalan boot yang
  # pesannya menyalahkan hal lain. Yang penting arah sebaliknya: kunci cadangan
  # TIDAK ikut ke container yang tidak membutuhkannya.
  #
  # ══ MENYAMBUNG LANGSUNG KE `pg`, MELEWATI PgBouncer ════════════════════════
  #
  # Alasan yang sama yang sudah berlaku untuk `job-backup`, dan kini berlaku dua
  # kali: jalur ini MENDAFTAR seluruh basis data (`pg_database`) lalu menyambung
  # ke tiap-tiap basis data satu per satu. PgBouncer hanya mengekspos basis data
  # yang terdaftar di konfigurasinya, jadi lewat pooler pencacahan akan
  # memulangkan sebagian — dan sebagian itulah bentuk cadangan paling berbahaya:
  # ia ADA, ia tampak berhasil, dan ia baru ketahuan kurang pada hari pemulihan.
  #
  # Satu URL mengatur keduanya: antrean `jobs` DAN parameter sambungan yang
  # diserahkan ke `pg_dump` (`internal/db/dsn.go` → `SambunganKendali`).
  svc-tenant:
    build:
      context: .
      target: integrator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-integrator:${SAI_TAG:-latest}
    container_name: sai-svc-tenant
    restart: unless-stopped
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://${PG_USER:-sai}:${PG_PASSWORD}@pg:5432/sai_control
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Hanya-baca, dan itu menghapus seluruh kelas kecelakaan di mana jalur
      # cadangan justru merusak yang dicadangkannya.
      - documents:/app/data/documents:ro
      - audit:/app/data/audit:ro
      # ⚠ SATU-SATUNYA mount yang bisa DITULIS, dan hanya untuk hasilnya
      # sendiri. Dipakai ketika `BACKUP_S3_BUCKET` belum disetel: artefak
      # terenkripsi mendarat di sini alih-alih tidak dibuat sama sekali.
      - cadangan:/app/data/cadangan
    networks:
      - internal
    # Pelari menyelesaikan pekerjaan yang sedang jalan lalu berhenti mengklaim.
    # 60s bukan "cukup untuk menyelesaikan dump" — dump bisa berjam-jam, dan
    # yang menanganinya bukan jendela ini melainkan *lease*: pekerjaan yang
    # terpotong dipulangkan oleh `ReclaimStale` lalu diklaim lagi. Yang dibeli
    # 60 detik adalah penulisan objek yang sedang berjalan selesai rapi.
    stop_grace_period: 60s

  # ── DUA APLIKASI, DUA IMAGE ────────────────────────────────────────────────
  #
  # Aplikasi pelanggan (`src/`, image `sai-accounting`) dan konsol operator
  # (`apps/operator`, image `sai-accounting-operator`) adalah dua aplikasi Next
  # yang dibangun dari commit yang sama dan ditarik dengan `SAI_TAG` yang sama;
  # keduanya menulis basis data yang sama, jadi versi skemanya harus satu.
  # Bidangnya ditentukan host (`packages/core/src/operator-plane.ts`): image
  # pelanggan tidak memuat rute konsol, dan konsol menjawab 404 untuk host
  # selain `OPERATOR_HOST`. Lihat docs/arsitektur/07-RIWAYAT.md
  #
  # ⚠ NAMA SERVICE TRAEFIK HARUS BERBEDA (`sai-app` vs `sai-ops`). Kalau
  # keduanya memakai nama service yang sama, Traefik menganggapnya SATU service
  # dengan dua backend lalu menyeimbangkan beban di antaranya — dan permintaan
  # operator bisa mendarat di container pelanggan. Itu membatalkan seluruh
  # alasan pemisahan ini ada, tanpa satu pun galat.

  # ── BIDANG PELANGGAN ────────────────────────────────────────────────────────
  # Enam grup rute: (marketing), (auth), (tenant)/(panel), (dashboard), (setup),
  # (docs). Inilah container yang melayani pembukuan, jadi ia yang memegang
  # volume `documents`.
  app-customer:
    build:
      context: .
      target: runner
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}:${SAI_TAG:-latest}
    container_name: sai-app-customer
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # ⚠ DIKOSONGKAN DENGAN SENGAJA — ini penjaga, bukan kelalaian.
      #
      # `environment:` menimpa `env_file:` di Compose, jadi walau `.env` memuat
      # OPERATOR_HOST (dan ia HARUS memuatnya, untuk container di bawah),
      # container INI menerimanya kosong. `configuredOperatorHost()` lalu
      # menjawab null, dan `decideOperatorRouting` menjawab `blocked` untuk
      # setiap /operator — 404.
      #
      # Artinya konsol operator tidak terjangkau di sini BAHKAN BILA seseorang
      # berhasil mengirim Host operator langsung ke container ini, melewati
      # Traefik. Itu lapis yang tidak dimiliki susunan satu-container.
      OPERATOR_HOST: ""
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Node 22 ships global fetch — no curl/wget needed in the image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Berkas dokumen sejak issue #367. Volume `uploads` (public/) DICABUT
      # 2026-08-16 sesuai syarat yang ditulis di sini sendiri: pemindahannya
      # sudah dijalankan dan melaporkan 0 dipindahkan · 0 yatim, atas tabel
      # `documents` yang berisi 0 baris di keempat PT. Jadi tidak ada dokumen
      # lama yang kehilangan tempat — memang tidak pernah ada.
      - documents:/app/data/documents
      - audit:/app/data/audit
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      # Attach routing to the shared Traefik network (not `internal`).
      - "traefik.docker.network=traefik_default"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.sai-app.entrypoints=web"
      - "traefik.http.routers.sai-app.rule=Host(`${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-app.middlewares=sai-https"
      - "traefik.http.middlewares.sai-https.redirectscheme.scheme=https"
      # HTTPS router with the existing Let's Encrypt resolver
      - "traefik.http.routers.sai-app-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-app-secure.rule=Host(`${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-app-secure.tls=true"
      - "traefik.http.routers.sai-app-secure.tls.certresolver=le"
      - "traefik.http.routers.sai-www.entrypoints=web"
      - "traefik.http.routers.sai-www.rule=Host(`www.${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-www.middlewares=sai-www-apex"
      - "traefik.http.routers.sai-www-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-www-secure.rule=Host(`www.${APP_DOMAIN:-saiaccounting.id}`)"
      - "traefik.http.routers.sai-www-secure.middlewares=sai-www-apex"
      - "traefik.http.routers.sai-www-secure.tls=true"
      - "traefik.http.routers.sai-www-secure.tls.certresolver=le"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.regex=^https?://www\\.([^/]+)(.*)"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.replacement=https://$${1}$${2}"
      - "traefik.http.middlewares.sai-www-apex.redirectregex.permanent=true"
      # Which container port Traefik forwards to
      - "traefik.http.services.sai-app.loadbalancer.server.port=3000"
      # Traefik-side health probe
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.sai-app.loadbalancer.healthcheck.timeout=5s"

  # ── BIDANG OPERATOR (issue #154) — HOSTNAME SENDIRI ─────────────────────────
  # Container-nya kini TERPISAH; yang memisahkan BIDANG-nya tetap HOST. Cookie
  # berlingkup host, jadi sesi pelanggan yang bocor tidak pernah bisa menjangkau
  # konsol operator, dan sebaliknya — itulah seluruh alasan pemisahan ini ada,
  # dan kenapa konsol ini TIDAK boleh menumpang di domain aplikasi.
  # Penjaga aplikasi menegakkan hal yang sama dari sisi kode: di host operator
  # setiap rute pelanggan 404, di host pelanggan setiap /operator 404. Tanpa
  # OPERATOR_HOST di .env, /operator 404 di MANA PUN.
  #
  # ⚠️  MENAMBAH PROXY DI DEPAN TRAEFIK? BACA INI DULU (issue #162).
  # Daftar IP operator (OPERATOR_IP_ALLOWLIST) membandingkan alamat klien
  # yang dibaca dari `x-forwarded-for`. Aplikasi mengambil entri ke-N dari
  # KANAN, dengan N = OPERATOR_TRUSTED_PROXY_HOPS (bawaan 1 = Traefik saja,
  # yaitu susunan sekarang). Entri paling kanan adalah satu-satunya yang
  # ditulis Traefik sendiri; yang di kirinya bisa saja diketik klien.
  #
  # Menaruh Cloudflare, CDN, atau load-balancer kedua DI DEPAN Traefik
  # menambah satu hop: setel OPERATOR_TRUSTED_PROXY_HOPS=2 di .env pada
  # perubahan yang SAMA. Kalau lupa, yang terbaca adalah alamat CDN — dan
  # seluruh dunia yang lewat CDN itu tampak sebagai satu IP.
  #
  # Sebaliknya, JANGAN menurunkan angkanya di bawah jumlah proxy yang
  # sebenarnya: setiap hop yang tidak dihitung adalah satu entri kiriman
  # klien yang ikut dipercaya. Rantai yang lebih pendek dari angka ini
  # ditolak (gagal-tertutup), bukan ditebak.
  app-operator:
    # Aplikasi Next TERSENDIRI sejak monorepo Fase 3d + 4 (`apps/operator`).
    # Image pelanggan tidak lagi memuat konsol; image ini tidak memuat satu pun
    # halaman buku. Ditarik dari tag yang SAMA (`SAI_TAG`) dengan app-customer —
    # keduanya menulis basis data yang sama, jadi versi skemanya harus satu.
    build:
      context: .
      target: runner-operator
    image: ${SAI_IMAGE:-ghcr.io/tri-evendi/sai-accounting}-operator:${SAI_TAG:-latest}
    container_name: sai-app-operator
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # `OPERATOR_HOST` datang dari `.env` apa adanya — TIDAK ditimpa di sini.
    # Tanpa nilainya, `decideOperatorRouting` menjawab `blocked` untuk setiap
    # /operator dan container ini tidak melayani apa pun yang berguna. Itu
    # gagal-tertutup: konsol yang salah konfigurasi menjadi 404, bukan terbuka.
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Dihubungi lewat 127.0.0.1, yaitu host yang BUKAN OPERATOR_HOST. Di sana
      # `decideOperatorRouting` menjawab `customer`, lalu `/api/health` lolos
      # sebagai jalur publik — jadi probe ini tetap 200 dan tidak menuntut
      # kelonggaran khusus di penjaga.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # HANYA `audit` — dan itu hasil pemeriksaan, bukan dugaan.
      #
      # Jejak operator tinggal di tabel `operator_audit_logs` sejak migration
      # platform 0002, dan berkas lamanya sudah dipindahkan di produksi
      # (17 Okt 2026). Volume ini tinggal arsip `.dipindahkan` dan aman dicabut.
      # Konsol tidak pernah menyentuh `data/documents`.
      #
      # Tidak memasang volume yang tidak dibutuhkan adalah pengurangan HAK,
      # bukan penghematan: berkas dokumen setiap pelanggan kini berada di luar
      # jangkauan proses konsol operator.
      - audit:/app/data/audit
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # ⚠ TIDAK ADA router untuk APP_DOMAIN di sini — dan itu disengaja.
      # Container ini hanya boleh dijangkau lewat OPERATOR_DOMAIN. Menambahkan
      # router APP_DOMAIN akan membuatnya ikut melayani rute pelanggan, yang
      # membatalkan pemisahan ini.
      - "traefik.http.routers.sai-ops.entrypoints=web"
      - "traefik.http.routers.sai-ops.rule=Host(`${OPERATOR_DOMAIN:-ops.saiaccounting.id}`)"
      - "traefik.http.routers.sai-ops.middlewares=sai-https"
      - "traefik.http.routers.sai-ops-secure.entrypoints=websecure"
      - "traefik.http.routers.sai-ops-secure.rule=Host(`${OPERATOR_DOMAIN:-ops.saiaccounting.id}`)"
      - "traefik.http.routers.sai-ops-secure.tls=true"
      - "traefik.http.routers.sai-ops-secure.tls.certresolver=le"
      # Nama service SENDIRI — lihat peringatan di kepala blok ini.
      - "traefik.http.services.sai-ops.loadbalancer.server.port=3000"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.sai-ops.loadbalancer.healthcheck.timeout=5s"
networks:
