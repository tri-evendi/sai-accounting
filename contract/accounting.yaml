# ═══════════════════════════════════════════════════════════════════════════
# KONTRAK AKUNTANSI — konstanta yang dibaca DUA bahasa (09 §3.5, tahap 1d)
#
# Dari sini dibangkitkan (`bun run contract:gen`):
#   • TypeScript → packages/core/src/generated/accounting.ts
#   • Go         → services/integrator/internal/contract/accounting_gen.go
#
# ══ YANG BOLEH MASUK: HANYA YANG PUNYA PEMBACA GO HARI INI ═════════════════
# Kontrak yang dibangkitkan untuk nol pembaca adalah berkas yang menyimpang
# tanpa ada yang menyadarinya — ia tidak punya sisi kedua yang bisa
# membantahnya (09 §3.5). Jadi isi berkas ini mengikuti laporan yang SUDAH
# pindah ke Go, bukan rencana:
#
#   • `money.scale`   — dibaca `internal/ledgerread` (urai NUMERIC jadi sen
#                       bilangan bulat) dan `src/lib/reports.ts` (cek seimbang
#                       Neraca Saldo pada ketelitian sen).
#   • `account_types` — dibaca `internal/ledgerread` (akun bertipe asing di
#                       Neraca Saldo dilaporkan, bukan ditelan) dan
#                       `src/lib/accounting.ts` (daftar tipe akun aplikasi).
#
#   • `account_categories` + `account_type_categories` — dibaca Laba Rugi dan
#                       Neraca Go (`internal/ledgerread/statements.go`) dan
#                       `src/lib/accounting.ts` (`accountCategoryFor`).
#   • `category_statement_side` — sisi yang dilaporkan POSITIF per kategori di
#                       Laba Rugi & Neraca; dibaca kedua sisi (`reports.ts`).
#   • `income_statement` — band Laba Rugi bertingkat (#123); dibaca
#                       `incomeStatementSectionFor` dan Laba Rugi Go.
#   • `closing_journal_type` — jenis jurnal penutup tahunan (#555) yang DIBUANG
#                       Laba Rugi; dibaca `year-close.ts` dan Laba Rugi Go.
#
# Yang SENGAJA BELUM ada: saldo normal per tipe, `CONTRACT_STATUSES`,
# `CURRENCIES`, ambang materialitas. Tidak satu pun laporan Go membacanya —
# saldo normal hanya dibaca formulir bagan akun & buku besar (TS), dan
# `accumulated_depreciation` membuktikan ia BUKAN turunan kategori (aset,
# saldo normal kredit). Laba Rugi & Neraca memakai sisi KATEGORI, bukan sisi
# normal tipe: akumulasi penyusutan tampil NEGATIF di blok aset (kontra-aset),
# bukan positif di sisi lain.
#
# ══ MENGUBAH ═══════════════════════════════════════════════════════════════
#   1. ubah di bawah;
#   2. `bun run contract:gen`;
#   3. commit berkas bangkitannya bersama perubahan ini — `contract:gen --cek`
#      (dipanggil `tests/contract-accounting.test.ts`) menolak yang basi.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

money:
  # Skala kolom uang `Decimal(15,2)` (docs/DATABASE.md). Satu SEN adalah
  # 10^-scale rupiah; kedua bahasa membandingkan uang pada ketelitian ini.
  scale: 2

# ── Tipe akun ──────────────────────────────────────────────────────────────
# URUTANNYA BERMAKNA: ini urutan pilihan di formulir bagan akun, dan entri
# pertama adalah bawaannya. Label, kategori, dan saldo normal tetap di
# `src/lib/accounting.ts`, dipetakan per nilai lewat `Record<AccountType, …>`
# — tipe baru di sini yang lupa diberi label di sana adalah galat `tsc`.
account_types:
  - cash_bank
  - account_receivable
  - inventory
  - other_current_asset
  - fixed_asset
  - accumulated_depreciation
  - other_asset
  - account_payable
  - tax_payable
  - other_current_liability
  - long_term_liability
  - equity
  - revenue
  - other_income
  - cogs
  - expense
  - other_expense

# ── Kategori akun ──────────────────────────────────────────────────────────
# Lima kategori laporan keuangan. Tipe akun yang TIDAK punya kategori (nilai
# basis data di luar kontrak) tidak masuk Laba Rugi maupun Neraca di KEDUA
# bahasa — Neraca Saldo tetap menghitungnya (lihat `unknownTypes` Go).
account_categories:
  - asset
  - liability
  - equity
  - revenue
  - expense

# Setiap tipe di `account_types` tepat SATU kategori — generator menolak tipe
# tanpa kategori, kategori asing, dan kunci yang bukan tipe.
account_type_categories:
  cash_bank: asset
  account_receivable: asset
  inventory: asset
  other_current_asset: asset
  fixed_asset: asset
  accumulated_depreciation: asset
  other_asset: asset
  account_payable: liability
  tax_payable: liability
  other_current_liability: liability
  long_term_liability: liability
  equity: equity
  revenue: revenue
  other_income: revenue
  cogs: expense
  expense: expense
  other_expense: expense

# Sisi saldo yang dilaporkan POSITIF di Laba Rugi dan Neraca, per KATEGORI:
# `debit` = debit − kredit, `credit` = kredit − debit. Per kategori, bukan per
# tipe — itu yang membuat Retur Penjualan menetralkan dirinya di pendapatan dan
# Akumulasi Penyusutan tampil negatif di aset.
category_statement_side:
  asset: debit
  liability: credit
  equity: credit
  revenue: credit
  expense: debit

# ── Laba Rugi bertingkat (#123) ────────────────────────────────────────────
# Penjualan − HPP = Laba Kotor, − Beban Operasional = Laba Usaha, ± lain-lain
# = Laba Bersih. Urutan `sections` = urutan band di laporan.
#
# Aturannya TOTAL atas akun laba rugi: tipe di `type_sections` mendapat band
# sendiri, SISANYA jatuh ke band bawaan kategorinya. Tipe pendapatan/beban
# yang ditambahkan kelak karena itu tetap mendarat di band yang terlihat —
# bukan hilang dari rincian sambil tetap terjumlah di total.
income_statement:
  sections:
    - sales
    - cogs
    - operating_expense
    - other_income
    - other_expense
  type_sections:
    other_income: other_income
    cogs: cogs
    other_expense: other_expense
  category_default_sections:
    revenue: sales
    expense: operating_expense

# ── Tutup buku tahunan (#555) ──────────────────────────────────────────────
# `journals.type` jurnal penutup. Laba Rugi MEMBUANGNYA (tanpanya tahun yang
# baru ditutup melaporkan laba NOL); Neraca dan Neraca Saldo MEMASUKKANNYA —
# di situlah Laba Ditahan memperoleh saldonya.
closing_journal_type: closing
