# ═══════════════════════════════════════════════════════════════════════════
# KONTRAK PEKERJAAN — satu sumber untuk kedua bahasa (01 §10, Poliglot)
#
# Berkas ini DIBACA, tidak pernah disalin. Dari sini dibangkitkan:
#   • TypeScript → packages/core/src/generated/job-kinds.ts  (bun run contract:gen)
#   • Go         → services/integrator/internal/contract/jobs_gen.go
#
# ══ KENAPA DIBANGKITKAN, BUKAN DITULIS DUA KALI ════════════════════════════
# Dua daftar tulis tangan menyimpang TANPA GALAT, dan bentuk penyimpangannya
# sudah bisa diramalkan sekarang:
#
#   • `kind` yang hanya dikenal penerbit (Node) tapi tidak satu pun jalur
#     mengklaimnya → baris `queued` yang menumpuk SELAMANYA. Tidak ada galat,
#     tidak ada pekerja yang mengeluh; hanya antrean yang tumbuh dan metrik
#     umur-tertua yang perlahan memerah berbulan-bulan kemudian.
#   • `kind` yang dikenal pekerja tapi tidak pernah diterbitkan → kode mati yang
#     terlihat hidup.
#
# ══ MENAMBAH `kind` ════════════════════════════════════════════════════════
#   1. tambahkan di `kinds:` di bawah, dengan `lane` dan `max_attempts`;
#   2. `bun run contract:gen`;
#   3. commit berkas bangkitannya bersama perubahan ini — penjaga
#      `tests/contract-jobs.test.ts` menolak keduanya kalau tidak sinkron.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

# ── Status pekerjaan ───────────────────────────────────────────────────────
# Urutannya bermakna: `queued` → `claimed` → `done` | `failed` → `dead`.
# `failed` BUKAN akhir — ia menunggu percobaan berikutnya. `dead` yang akhir.
statuses:
  - queued
  - claimed
  - done
  - failed
  - dead

# ── Jalur ──────────────────────────────────────────────────────────────────
# Setiap jalur satu PROSES tersendiri; `kinds` di bawah menunjuk salah satunya.
# `single_instance: true` berarti lebih dari satu proses jalur itu salah —
# penerbit ganda menerbitkan dua kali, dan migration ganda bertabrakan.
lanes:
  interactive:
    description: ekspor & dokumen yang ditunggu pengguna di layar
    single_instance: false
  bulk:
    description: impor besar, paket laporan, surel borongan
    single_instance: false
    # Pagar memori PER PEKERJAAN (MiB heap Go). Jalur ini seproses dengan
    # `tenant` dan `interactive` di `svc-integrator` (09 §3.2, "1 image = 1
    # container"), jadi satu pekerjaan borongan yang kehabisan memori bukan
    # hanya menjatuhkan dirinya: OOM-killer membunuh SELURUH container —
    # termasuk dump cadangan yang sedang berjalan. Pagar ini membatalkan
    # pekerjaan `bulk` itu sendiri lebih dulu (gagal dengan sebab yang
    # terbaca), sebelum kernel memutuskan siapa yang mati.
    #
    # Konkurensi: SATU pekerjaan per proses (`jobs.Runner`, sama dengan setiap
    # jalur lain); skala jalur jamak = jumlah proses, bukan utas.
    memory_fence_mib: 512
  schedule:
    description: denyut penerbitan tiap jam — hanya MENERBITKAN, tidak melaksanakan
    single_instance: true
  tenant:
    description: cadangan & kesesuaian data per perusahaan; satu-satunya yang memegang rahasia
    single_instance: true
  schema:
    description: migration setiap perusahaan; dijalankan sekali saat rilis
    single_instance: true
  ledger:
    description: pekerjaan yang MENULIS buku besar — pintu posting tunggal (I-2)
    single_instance: true
    # Ambang alarm TERUKUR (09 §11) — satu-satunya jalur dengan sampel cukup
    # (≥ 200, ditegakkan generator). Produksi `sai_control.jobs` 21–23 Okt 2026,
    # 992 `ledger.recurring` (880 di antaranya ditulis sebelum PR #741 dengan
    # `run_after` UTC lawan `started_at` WIB: tunggunya dikoreksi −25.200 dtk):
    #   tunggu (started_at − run_after) p50 2,1 · p95 5,7 · p99 8,3 · maks 14,8 dtk
    #   durasi (finished_at − started_at) p95 443 ms (112 baris pasca-#741: 965 ms;
    #   runtime_samples, 576 sampel: 552 ms) · maks 1.580 ms
    # Aturan (09 §11): warn = maks(10 × p99 tunggu, 2 × upkeep) = 120;
    # late = maks(20 × maks tunggu, 5 × upkeep) = 300; durasi = 10 × p95
    # tertinggi dari ketiga sumber, dibulatkan ke 5 dtk = 10.000 ms.
    # SETEL ULANG bila p99 tunggu > 12 dtk (10 × p99 melewati lantai 120):
    # ledakan di awal jam tumbuh bersama jumlah dokumen berulang.
    alarm:
      queue_age_warn_seconds: 120
      queue_age_late_seconds: 300
      duration_p95_warn_ms: 10000
      samples: 992
      window: 2026-10-21/2026-10-23
  integration:
    description: integrasi luar (e-faktur, feed bank); tidak menyentuh pembukuan
    single_instance: false

# ── Jenis pekerjaan ────────────────────────────────────────────────────────
# `writes_ledger: true` HANYA boleh pada jalur `ledger`. Penjaga menegakkannya:
# pintu posting wajib tunggal, dan ia TypeScript (rancangan §3.3).
#
# ══ `schedule:` — KIND YANG DITERBITKAN DENYUT, DAN SIAPA PENERBITNYA ═══════
# Kind ber-`schedule:` diterbitkan tiap jam oleh SATU penerbit, dengan
# rekonsiliasi (09 §4): penerbit membaca keadaan, menyimpulkan apa yang jatuh
# tempo, dan `dedupe_key` yang unik membuat penerbitan ulang tidak melakukan
# apa pun. Tiga kunci, dan ketiganya dibaca DUA bahasa:
#
#   • `grain` — butir kunci idempotensi: `hour` (`YYYY-MM-DDTHH`) atau `day`
#     (`YYYY-MM-DD`), SELALU di UTC. Bukan WIB, dan itu disengaja: mesin
#     berulang menghitung batas hari di UTC (`src/lib/recurring.ts`), dan
#     menukar zonanya menggeser batas butir tujuh jam — pada hari peralihan
#     itu satu butir terbit DUA kali dengan kunci berbeda.
#   • `per_company` — satu baris per perusahaan aktif (kunci
#     `<kind>:<companyId>:<butir>`) atau satu untuk seluruh pemasangan
#     (`<kind>:<butir>`). Bentuk kuncinya SAMA PERSIS di kedua bahasa
#     (`@sai/core/schedule-due` · `internal/schedulelane/due.go`), dan
#     fikstur bersama `internal/schedulelane/testdata/schedule_due_fixtures.json`
#     membuktikannya — kunci yang sama itulah yang membuat peralihan penerbit
#     tidak pernah menerbitkan dua kali.
#   • `publisher` — `node` (langkah `recurring:publish`/`backup:publish` di
#     peran `scheduler`, `svc-worker`) atau `go` (jalur `schedule`,
#     `svc-integrator`). TEPAT SATU, dan kedua sisi membaca nilai yang sama
#     dari commit yang sama: sisi yang bukan penerbit melewati langkahnya.
#     Peralihan & jalan mundurnya: PRODUCTION.md §Penerbit denyut.
#
# Generator menolak: `grain` di luar hour/day, `publisher` di luar node/go,
# `schedule:` pada kind jalur `schedule` sendiri (denyut tidak menerbitkan
# dirinya lewat dirinya), dan `per_company` yang bukan boolean.
kinds:
  report.export:
    lane: interactive
    max_attempts: 3
    description: satu laporan menjadi berkas yang diunduh pengguna

  report.export_go:
    lane: interactive
    max_attempts: 3
    description: >
      satu laporan menjadi berkas, DIHITUNG GO (tahap 1d). Jenis tersendiri,
      bukan `report.export` yang sama, sebab pelari mengklaim per `kind`: jalur
      `interactive` dilayani DUA bahasa selama transisi, dan satu `kind` dengan
      dua pengklaim adalah dua pelaksana untuk satu pekerjaan. Laporan mana yang
      diterbitkan ke sini diputuskan register `src/lib/report-engine.ts`
      (`engine: go`), bukan penerbitnya.

  document.generate:
    lane: interactive
    max_attempts: 3
    description: satu dokumen (faktur, surat jalan, kontrak) menjadi PDF

  company.provision:
    lane: interactive
    max_attempts: 1
    description: >
      buku PT baru: CREATE DATABASE → skema → hibah peran aplikasi → registry.
      Dipindah dari permintaan HTTP `app-customer` (Okt 2026) supaya container
      yang menghadap internet tidak lagi memegang kredensial PEMILIK
      (`PROVISION_DATABASE_URL`) — hanya `svc-worker` yang memegangnya.
      Jalur `interactive`, bukan `schema`/`ledger`: yang menunggu adalah orang
      di layar `/companies/new`, `schema` tidak punya pelari yang hidup terus,
      dan `ledger` (tunggal-instans) tidak boleh ditahan puluhan detik DDL yang
      tidak menulis buku. `max_attempts: 1` — penyediaan yang gagal ditampilkan
      SEGERA ke penunggunya, bukan disembunyikan di balik backoff; pengulangan
      oleh pengguna MELANJUTKAN buku yang setengah jadi (lihat
      `src/lib/company-provisioning.ts`), jadi tidak ada yang hilang.

  report.package:
    lane: bulk
    max_attempts: 3
    description: paket laporan satu periode

  import.process:
    lane: bulk
    max_attempts: 1
    description: >
      impor berkas besar. `max_attempts: 1` DISENGAJA — impor yang diulang
      otomatis setelah gagal separuh jalan adalah cara tercepat menggandakan
      data master. Pengguna yang mengulang melihat apa yang sudah masuk.

  mail.batch:
    lane: bulk
    max_attempts: 3
    description: surel borongan (pengingat, pemberitahuan)

  tenant.data_export:
    lane: bulk
    max_attempts: 2
    description: >
      ekspor data mandiri tenant (#142, hak akses UU PDP): ZIP berisi CSV
      SETIAP tabel di SETIAP PT milik tenant + berkas dokumennya, ditulis ke
      volume `hasil`. Tingkat TENANT (`company_id` NULL, `tenant_id` diisi);
      diunduh lewat `/api/tenant/export/jobs/<id>/result` dengan izin tenant
      `tenant.export`, bukan lewat rute hasil per-PT. Kind PERTAMA jalur
      `bulk` sisi Go (`internal/bulklane`) — HANYA MEMBACA buku; jejak audit
      tenant ditulis PENERBIT (Node) saat menerbitkan, sebab Go tidak menulis
      `tenant_audit_logs`. `max_attempts: 2`: ekspor yang gagal karena buku
      sesaat tak terjangkau dicoba sekali lagi; yang gagal dua kali menuntut
      mata manusia, bukan putaran ketiga atas ZIP bergiga.
    # ══ `runner:` — SAKELAR ts → go (keputusan pemilik 23 Okt 2026) ═════════
    # `node` (bawaan): `GET /api/tenant/export` men-stream ZIP SINKRON dari
    # `src/lib/tenant-export.ts` seperti sejak #142, dan TIDAK ada baris
    # `jobs` untuk kind ini — tombolnya tautan unduh biasa.
    # `go`: tombol menerbitkan pekerjaan (`POST /api/tenant/export`), jalur
    # `bulk` di `svc-integrator` (`internal/tenantexport`) menulis ZIP-nya,
    # dan layar menunggu → tautan unduh. `GET` sinkron dijawab 409
    # `export_async` — satu pelaksana, tidak pernah dua.
    # Pekerjaan yang tiba di Go sementara nilai di sini `node` (terbit sebelum
    # jalan mundur) DIGAGALKAN dengan pesan yang terbaca, tidak dikerjakan.
    # Syarat `go`: `bun run parity:tenant-export` lulus atas buku PRODUKSI
    # (PRODUCTION.md §Ekspor data mandiri).
    # ✅ Lulus 24 Okt 2026 (0.21.0, hanya baca): 11 tenant × 1 ekspor — 11
    # setara · 0 berselisih · 0 gagal; 1.111 berkas identik per byte (terbesar
    # pt-sai: 194 berkas, 27.832 baris).
    runner: go

  tenant.backup:
    lane: tenant
    max_attempts: 2
    description: cadangan per perusahaan, tersandi sebelum meninggalkan mesin
    # Satu baris untuk SELURUH pemasangan per HARI UTC (RPO satu hari).
    schedule:
      grain: day
      per_company: false
      publisher: go

  tenant.conformance:
    lane: tenant
    max_attempts: 2
    description: >
      sapuan kesesuaian data SELURUH buku (11 pemeriksaan, hanya membaca) —
      satu pekerjaan per putaran, bukan per perusahaan: jejaknya satu baris
      `conformance_runs` per putaran, sama seperti sapuan Node.
    # ══ `runner:` — SAKELAR PERALIHAN PELAKSANA (09 §3.3, 23 Okt 2026) ══════
    # `node` (bawaan): peran `conformance` di `svc-worker` menjalankan
    # `scripts/check-data-conformance.ts` seperti sejak #374, dan TIDAK ada
    # baris `jobs` untuk kind ini.
    # `go`: langkah Node yang SAMA (pemicu mingguan di compose tidak berubah)
    # tidak menyapu — ia MENERBITKAN satu pekerjaan `tenant.conformance`
    # (kunci `tenant.conformance:<jam UTC>`) lalu keluar 0, dan jalur `tenant`
    # di `svc-integrator` (`internal/conformance`) yang menyapu dan menulis
    # jejaknya. Pekerjaan yang tiba di Go sementara nilai di sini `node`
    # diselesaikan TANPA menyapu: tepat satu pelaksana, tidak pernah dua.
    # Kedua sisi membaca nilai yang sama dari commit yang sama. Peralihan &
    # jalan mundurnya: PRODUCTION.md §Pelaksana kesesuaian data.
    #
    # Generator menolak nilai di luar node/go, `runner` bersama `schedule:`,
    # dan `runner` pada penulis buku.
    runner: go

  schema.migrate:
    lane: schema
    max_attempts: 1
    description: >
      migration satu perusahaan. `max_attempts: 1` — migration yang gagal
      separuh jalan menuntut mata manusia, bukan percobaan kedua yang otomatis.

  schedule.tick:
    lane: schedule
    max_attempts: 1
    description: >
      denyut penerbitan. `max_attempts: 1` karena putaran berikutnya datang
      sejam kemudian dan menyusul sendiri — rekonsiliasi, bukan pengulangan.
      Diterbitkan DAN diklaim jalur `schedule` Go (`internal/schedulelane`),
      satu baris per jam UTC (`schedule.tick:<YYYY-MM-DDTHH>`), dan HANYA bila
      sedikitnya satu kind ber-`schedule:` menyatakan `publisher: go` — selama
      Node penerbit semuanya, denyut ini tidak terbit sama sekali. Barisnya
      jejak denyut Go: satu `done` per jam, kegagalannya `dead` dengan
      `last_error`, terbaca di konsol `/scheduler`.

  ledger.recurring:
    lane: ledger
    max_attempts: 3
    writes_ledger: true
    description: dokumen berulang yang MEMPOSTING lewat pintu posting
    # Diterbitkan DENYUT (lihat `schedule:` di kepala bagian `kinds`): satu
    # baris per perusahaan per JAM UTC. Yang memposting tetap jalur `ledger`
    # (Node) — penerbit Go hanya menulis baris `jobs`.
    schedule:
      grain: hour
      per_company: true
      publisher: go

  ledger.dunning:
    lane: ledger
    max_attempts: 3
    writes_ledger: true
    description: dunning yang membuat catatan di buku

  # ── e-Faktur lewat PJAP (docs/EFAKTUR.md) ─────────────────────────────────
  # Empat kind, DUA bahasa, dan tidak satu pun pengklaim ganda:
  #   • `integration.efaktur_*` — Go (`internal/integrationlane`): bicara dengan
  #     PJAP. TIDAK menulis apa pun selain baris `jobs`.
  #   • `efaktur.record` — Node (`workers/interactive.ts`): menuliskan hasil PJAP
  #     ke `efaktur_submissions` di buku PT. Itulah jalan hasil kembali ke buku
  #     tanpa menambah daftar-izin tulisan Go (`tests/services-go.test.ts`) dan
  #     tanpa satu layanan memanggil layanan lain (I-3): antreanlah perantaranya.
  # `max_attempts: 5` untuk ketiga kind Go — layanan pihak lain memang kadang
  # mati sebentar, dan backoff kontrak (30 s → 1 jam) yang menjarakkannya.
  # Pengulangan AMAN karena `idempotency_key` per upaya ikut dikirim ke PJAP.
  integration.efaktur_submit:
    lane: integration
    max_attempts: 5
    description: kirim satu faktur keluaran (XML Coretax yang dibekukan) ke PJAP

  integration.efaktur_poll:
    lane: integration
    max_attempts: 5
    description: >
      tanyakan status satu kiriman ke PJAP. Selama DJP belum memutuskan, pelari
      menerbitkan putaran berikutnya dengan jeda bertambah (`round` di muatan,
      jeda dari backoff kontrak) sampai batas putaran — lalu berhenti dan
      meminta orang memeriksa di Coretax. Bukan `failed` yang diulang: "masih
      diproses" bukan kegagalan.

  integration.efaktur_cancel:
    lane: integration
    max_attempts: 5
    description: minta PJAP membatalkan faktur pajak yang sudah disetujui

  efaktur.record:
    lane: interactive
    max_attempts: 5
    description: >
      catat satu hasil PJAP (status, NSFP, pesan) ke `efaktur_submissions` di
      buku PT. Diterbitkan jalur `integration` Go, diklaim Node — hanya Node
      yang menulis basis data perusahaan. Muatannya status kiriman, bukan
      angka akuntansi (basis data kendali tidak memuat satu pun).

  integration.bank_feed:
    lane: integration
    max_attempts: 5
    description: tarik mutasi bank

  # ── Pemakai outbox (09 §4, keputusan pemilik 23 Okt 2026) ─────────────────
  document.invoice_send:
    lane: interactive
    max_attempts: 3
    description: >
      kirim faktur yang baru DIPOSTING ke surel pelanggan, PDF terlampir —
      pemakai pertama outbox transaksional. Diterbitkan HANYA oleh relay outbox
      (`workers/outbox-relay.ts`) dari peristiwa `invoice.posted`, tidak pernah
      dari permintaan HTTP. Pelaksananya diam (selesai tanpa mengirim) selama
      `company_settings.invoice_auto_send` mati — bawaannya MATI, jadi peristiwa
      yang mengalir tidak mengubah perilaku siapa pun sampai PT-nya
      menyalakannya. Idempoten lewat kunci unik riwayat kirim
      (`invoice_sends`: reminder_kind `on_post`), jadi pengiriman
      sekurang-kurangnya-sekali dari relay tidak pernah menjadi dua surel.

# ── Outbox transaksional (09 §4, dibangun 23 Okt 2026) ────────────────────
#
# Tabel `outbox` di SETIAP buku PT, ditulis dalam TRANSAKSI YANG SAMA dengan
# tulisan domainnya (`src/lib/outbox.ts` — pintu tulisnya satu). Relay Node
# (peran `outbox` di `svc-worker`) memindahkannya ke `jobs` di basis data
# KENDALI. Kosakatanya di sini, bukan di kode, karena relay MENERBITKAN kind
# dari peta ini: peristiwa yang konsumennya bukan kind sah adalah baris outbox
# yang tidak pernah bisa terbit.
#
# Hanya Node yang membaca bagian ini. Pohon Go tidak menulis maupun membaca
# `outbox` (daftar-izin tulisan Go tetap `jobs` + `backup_runs`), jadi tidak
# ada bangkitan Go — dan itu disengaja: konstanta yang dibangkitkan ke bahasa
# yang tidak memakainya adalah kode mati yang terlihat hidup.
#
#   • `events.<tipe>.aggregate`  — jenis agregat (`snake_case`), kolom
#     `outbox.aggregate_type`.
#   • `events.<tipe>.consumers`  — kind yang diterbitkan relay untuk SETIAP
#     baris bertipe ini; satu baris `jobs` per (baris outbox, kind), kunci
#     dedupe `outbox:<companyId>:<outboxId>:<kind>`.
#
# Generator menolak: tipe di luar bentuk `<agregat>.<kata_kerja>`, konsumen
# yang bukan kind, konsumen ber-`schedule:` (dua penerbit untuk satu kind),
# ambang peringatan yang tidak di bawah ambang terlambat, dan putaran relay
# yang tidak lebih rapat daripada ambang peringatannya.
outbox:
  events:
    invoice.posted:
      aggregate: invoice
      description: >
        faktur penjualan mendapat jurnal PERTAMANYA (postForSource /
        repostForSource) — sekali per faktur seumur hidupnya, dedupe
        `invoice.posted:<invoiceId>`; edit yang memposting ulang tidak
        menerbitkan lagi.
      consumers:
        - document.invoice_send
  # Jeda putaran relay ketika tidak ada yang dipindahkan (polling, bukan CDC).
  relay_poll_ms: 2000
  # Baris paling banyak per buku per putaran (satu transaksi buku).
  relay_batch_size: 100
  # Baris yang SUDAH terbit dibuang sesudah sekian hari — lebih lama daripada
  # retensi `done` di `jobs` tidak berguna: kunci dedupe-nya sudah hilang di sana.
  published_retention_days: 14
  # Ambang umur baris tertua yang BELUM terbit, lintas buku.
  lag_warn_seconds: 120
  lag_late_seconds: 600
  # Jejak putaran relay per buku yang lebih tua dari ini = relay MATI (atau
  # buku itu tak terjangkau) — umur nol yang tak diperbarui bukan umur nol.
  relay_stale_seconds: 300

# ── Pemilik berkas hasil ──────────────────────────────────────────────────
#
# uid/gid yang MEMBACA volume `hasil`: pengguna `node` di tahap `runner`
# (`USER node` di Dockerfile — uid 1000 di image resmi `node:*`). Volume itu
# DITULIS pelari jalur `interactive` — Node (peran `interactive` di `svc-worker`)
# dan Go (`svc-integrator`), keduanya root — dan DIBACA `app-customer` sebagai
# `node`. Berkasnya ditulis 0600 di direktori 0700 (tidak terbaca siapa pun
# lain), jadi tanpa `chown` ke pemilik ini rute unduhan menjawab 404 untuk
# setiap hasil: `stat` atas berkas milik root ditolak sebelum satu byte pun
# terbaca. Dua bahasa menulis, satu angka — maka ia di kontrak, bukan diketik
# dua kali. Dijaga `tests/job-result-owner.test.ts`.
results:
  owner_uid: 1000
  owner_gid: 1000

# ── Angka antrean ──────────────────────────────────────────────────────────
#
# ══ KENAPA ANGKA IKUT MASUK KONTRAK, PADAHAL IA BUKAN KOSAKATA ═════════════
# Sampai tahap 1b hanya ada satu pelari, jadi angka-angka ini cukup hidup
# sebagai konstanta TypeScript di `@sai/core/job-backoff`. Begitu pelari KEDUA
# lahir dalam bahasa lain, keduanya menjadi kelas konstanta yang paling
# berbahaya di seluruh rancangan: dipakai dua bahasa, dan penyimpangannya tidak
# menghasilkan satu pun galat — hanya dua pelari yang bersikap berbeda terhadap
# satu tabel.
#
# Bentuk penyimpangannya bukan hipotesis, dan tiap baris di bawah punya
# versinya sendiri:
#
#   • `lease_renew_ms` yang lebih besar di satu sisi → pekerja sisi itu
#     kehilangan pekerjaannya di tengah jalan, diklaim pekerja kedua, dan untuk
#     `tenant.backup` itu dua dump menulis ke satu kunci objek;
#   • `upkeep_ms` yang melewati ambang basi di satu sisi → pekerjaan dari
#     pekerja yang mati menunggu satu putaran penuh LAGI, dan waktu tunggu itu
#     tidak muncul di satu pun angka;
#   • `queue_age_*` yang berbeda → probe kesehatan dan pelari tidak sepakat
#     tentang kapan antrean disebut terlambat, jadi yang satu hijau sementara
#     yang lain membangunkan orang.
#
# Prosa yang menjelaskan SEBAB tiap angka tetap tinggal di tempat angkanya
# dipakai (`packages/core/src/job-backoff.ts`, `queue-health.ts`) — yang pindah
# ke sini angkanya, bukan alasannya. Generator menolak pasangan yang tidak
# konsisten, jadi tidak ada bahasa yang bisa memuat kombinasi yang salah.
numbers:
  # Backoff: penundaan dasar, dan plafon di satu jam.
  backoff_base_ms: 30000
  backoff_max_ms: 3600000

  # Lease: interval pembaruan, dan ambang basi sebagai KELIPATANNYA.
  lease_renew_ms: 30000
  lease_stale_factor: 4

  # Putaran pelari. `upkeep_ms` WAJIB lebih rapat daripada ambang basi
  # (lease_renew_ms × lease_stale_factor) — ditegakkan generator.
  upkeep_ms: 60000
  idle_ms: 2000

  # Retensi baris `done`. `dead` dan `failed` TIDAK pernah dipangkas.
  done_retention_days: 14

  # Ambang umur antrean BAWAAN — dipakai setiap jalur yang tidak punya
  # `alarm:` terukur di `lanes:` (sampelnya < 200: interactive, bulk,
  # schedule, tenant, schema, integration per 23 Okt 2026, 09 §11).
  queue_age_warn_seconds: 420
  queue_age_late_seconds: 600

  # Pagar jalur tunggal-instans: denyut pembuktian kunci advisory. Dua bahasa
  # memegang pagar yang SAMA (`sai.lane.<jalur>`) — Node lewat
  # `@sai/db/session-lock`, Go lewat `jobs.LaneLock` — jadi waktunya satu angka.
  # Tiap denyut memastikan backend yang menjawab masih backend yang mengambil
  # kunci dan kuncinya masih di `pg_locks`; denyut yang gagal = kunci HILANG,
  # pelari berhenti mengklaim. Sesinya diberi `idle_session_timeout` sebesar
  # `lane_lock_idle_session_ms`, jadi pemegang yang terisolasi dibuang server
  # sesudah itu — dan pemegang itu sudah tahu lebih dulu, paling lambat
  # probe + query_timeout. Generator menegakkan
  # probe + query_timeout < idle_session (jendela berhenti pemegang lama).
  lane_lock_probe_ms: 15000
  lane_lock_query_timeout_ms: 10000
  lane_lock_idle_session_ms: 90000

# ── e-Faktur (docs/EFAKTUR.md) ─────────────────────────────────────────────
#
# Kosakata status kiriman e-Faktur dibaca DUA bahasa: Node menulis
# `efaktur_submissions.status` di buku PT; Go membacanya (kiriman yang sudah
# dibatalkan pengguna tidak dikirim) dan MELAPORKAN `outcomes` lewat
# `efaktur.record`. Daftar status wajib SAMA dengan CHECK di
# `prisma/postgresql/company/0004_efaktur_coretax/migration.sql` — dijaga
# `tests/efaktur-submission.test.ts`. Generator menolak `outcomes` di luar
# `submission_statuses`.
#
#   queued            → antre, belum dikirim
#   submitted         → diterima PJAP, menunggu keputusan DJP
#   approved          → disetujui; NSFP terbit
#   rejected          → ditolak DJP (pesan dari PJAP) — perbaiki, kirim ulang
#   failed            → tidak bisa dikirim (kredensial, penyedia, batas putaran)
#   cancel_requested  → pembatalan diminta pengguna, menunggu PJAP
#   canceled          → dibatalkan di DJP
#
# `poll_max_rounds`: putaran `integration.efaktur_poll` paling banyak. Jedanya
# backoff kontrak (`backoff_base_ms` × 2^putaran, plafon `backoff_max_ms`), jadi
# 24 putaran ≈ 19 jam — lebih dari cukup untuk persetujuan yang lazimnya
# hitungan menit; sesudahnya kiriman `failed` dengan pesan "periksa di Coretax".
efaktur:
  submission_statuses:
    - queued
    - submitted
    - approved
    - rejected
    - failed
    - cancel_requested
    - canceled
  outcomes:
    - submitted
    - approved
    - rejected
    - failed
    - canceled
  # `company_settings.efaktur_provider`: `mock` = uji tanpa jaringan (hasil
  # ditentukan isi XML, lihat `internal/efaktur/mock.go`); `pjap` = penyedia
  # sungguhan — KERANGKA sampai pemilik memilih PJAP (docs/EFAKTUR.md).
  providers:
    - mock
    - pjap
  poll_max_rounds: 24
