<!--
  SUMBER ikon aplikasi (issue #471).

  PNG di sebelahnya DITURUNKAN dari berkas ini, bukan digambar terpisah:
      rsvg-convert -w N -h N source.svg -o icon-N.png
  Sebuah PNG yang disunting sendiri akan menyimpang dari sumbernya tanpa ada
  yang bisa melihatnya — dan ikon adalah tempat penyimpangan paling lama tak
  ketahuan, sebab tak seorang pun membukanya lagi sesudah hari pertama.

  Lambangnya sengaja bentuk, bukan huruf: huruf menuntut font yang kebetulan
  ada di mesin yang merender, dan hasilnya berbeda di mesin berikutnya.
  Yang digambar: satu batang naik — buku yang bertambah — di atas garis dasar.

  Warna: colorPrimary AntD #1677ff (lihat antd-tokens.ts §warna merek).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1677ff"/>
  <g fill="#ffffff">
    <rect x="128" y="288" width="64" height="96" rx="12"/>
    <rect x="224" y="224" width="64" height="160" rx="12"/>
    <rect x="320" y="128" width="64" height="256" rx="12"/>
  </g>
  <rect x="112" y="404" width="288" height="20" rx="10" fill="#ffffff" opacity="0.72"/>
</svg>
