# Membangun image Docker produksi di runner GitHub, lalu mendorongnya ke GHCR.
#
# ══ Kenapa ada ══════════════════════════════════════════════════════════════
# Sebelum ini penggelaran berarti `docker compose build` DI SERVER PRODUKSI.
# Kotak itu 3,6 GB RAM dan juga melayani empat aplikasi lain, jadi `next build`
# di sana menghabiskan ~19 menit dengan iowait 58–92% — bukan karena kompilasi
# berat, melainkan karena kompilernya dihalaman masuk-keluar swap. Diukur saat
# menggelar 0.6.0. AGENTS.md bahkan melarang agent latar membangun di sana
# sebab dua build bersamaan sudah pernah menghasilkan OOM (exit 137).
#
# Runner GitHub punya RAM yang cukup dan tidak sedang melayani siapa pun.
# Dengan image jadi di registry, penggelaran menjadi `pull` + `up -d`: detik,
# bukan belasan menit, dan produksi tidak pernah bersaing dengan kompilernya.
#
# ══ Dua image, bukan satu ═══════════════════════════════════════════════════
# `docker compose build web` TIDAK membangun image `migrate` — pelajaran yang
# terulang beberapa rilis: `scheduler` dan `conformance` berjalan di atas image
# migrator, yang ikut memuat kode aplikasi, jadi melewatkannya berarti dua
# layanan menjalankan kode basi tanpa satu pun tanda. Matriks di bawah
# membangun KEDUANYA setiap kali, sehingga keduanya tidak bisa lagi menyimpang.
name: Publish production images

# ══ Dua saluran ═════════════════════════════════════════════════════════════
# • dorongan ke `main` → SaaS: `:latest` + `:sha-<pendek>` + `:<versi>`, persis
#   seperti sebelumnya.
# • tag git `v*` → saluran STABIL on-premise: `:<versi>` + `:sha-<pendek>`,
#   TANPA `:latest` (tag pada commit lama tidak boleh memundurkan SaaS), lalu
#   job `offline-bundle` merakit bundel `docker save` + SHA-256 + compose
#   on-premise sebagai aset GitHub Release, untuk customer tanpa akses
#   registry. Tag yang tidak sama dengan `package.json` DITOLAK: rilis yang
#   namanya bohong tentang isinya lebih buruk daripada rilis yang tidak terbit.
#   Dijaga `tests/release-channel.test.ts`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Tanpa ini `docker push` ke GHCR dijawab 403 meski login berhasil:
      # GITHUB_TOKEN bawaan hanya punya izin baca.
      packages: write

    strategy:
      # Satu target gagal TIDAK membatalkan yang lain — kalau `migrator` rusak,
      # kita masih ingin tahu apakah `runner` sehat.
      fail-fast: false
      matrix:
        include:
          - target: runner
            suffix: ""
          # Konsol operator sebagai aplikasi Next tersendiri (monorepo Fase 3d +
          # Fase 4). Dibangun dari COMMIT YANG SAMA dengan `runner` di setiap
          # dorongan — kedua aplikasi menulis basis data yang sama, jadi
          # keduanya tidak boleh berbeda versi skema. Ritual gelar memeriksa
          # tag `sha-` keduanya sama.
          - target: runner-operator
            suffix: "-operator"
          - target: migrator
            suffix: "-migrator"
          # `backup` ikut, meski jarang berubah dan tidak ada di jalur
          # penggelaran. Justru itu sebabnya: image yang tidak pernah dibangun
          # ulang adalah image yang membasi tanpa ada yang menyadarinya, dan
          # layanan cadangan sudah pernah mati berbulan-bulan karena akar
          # seperti itu.
          - target: backup
            suffix: "-backup"
          # ══ `integrator` — DITAMBAHKAN 20 Okt 2026, DAN IA SUDAH TERLAMBAT ══
          #
          # `docker-compose.yml` merujuk image ini untuk `svc-tenant` sejak
          # tahap 1b, dan Dockerfile punya targetnya sejak hari yang sama —
          # tetapi matriks ini tidak. Akibatnya image itu TIDAK PERNAH
          # diterbitkan, dan `docker compose pull svc-tenant` gagal dengan
          # `manifest unknown`: satu layanan di compose yang mustahil digelar,
          # tanpa satu baris merah di mana pun.
          #
          # Kelalaian itu tidak terlihat karena jalur gelarnya memang belum
          # pernah dijalankan untuk layanan ini. Yang menangkapnya akhirnya
          # pemeriksaan manual menjelang gelar pertama — dan "ketemu saat mau
          # deploy" adalah tempat paling mahal untuk menemukannya.
          #
          # Sejak sekarang `tests/image-compose-sepadan.test.ts` menolak setiap
          # image yang dirujuk compose tanpa target di sini. Alasannya sama
          # dengan yang sudah tertulis untuk `backup` di atas, dibalik: image
          # yang dirujuk tapi tidak dibangun lebih buruk daripada image yang
          # dibangun tapi tidak dipakai.
          - target: integrator
            suffix: "-integrator"

    steps:
      - uses: actions/checkout@v4

      - name: Baca versi dari package.json
        id: meta
        # Dipakai sebagai tag `0.6.0`. Dibaca dengan jq, bukan grep, supaya
        # tidak ikut menangkap "version" milik dependensi.
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(jq -r .version package.json)"
          sha_short="$(git rev-parse --short HEAD)"
          # Nama paket GHCR wajib huruf kecil; nama repo bisa tidak.
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # Saluran stabil: tag `vX.Y.Z` WAJIB sama dengan package.json.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} tidak sama dengan package.json ${version} — rilis ditolak."
            exit 1
          fi

          base="${REGISTRY}/${repo_lc}${SUFFIX}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$repo_lc" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<__TAGS__"
            # `:latest` HANYA dari main — tag git pada commit lama tidak boleh
            # memundurkan apa yang ditarik SaaS.
            [ "$GITHUB_REF_TYPE" = "tag" ] || echo "${base}:latest"
            echo "${base}:sha-${sha_short}"
            echo "${base}:${version}"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          # Tiga tag, dan yang kedua yang menggantikan ritual lama.
          #
          # Sebelum ini rollback menuntut `docker tag sai-luckyhands:latest
          # sai-luckyhands:rollback-<sha>` SEBELUM membangun, sebab build
          # menimpa `:latest` dan image lamanya langsung tak terjangkau di
          # containerd. Lupa satu kali berarti rollback berubah dari 30 detik
          # menjadi build 10 menit di tengah insiden.
          #
          # Dengan `sha-<pendek>` di registry, setiap rilis punya jangkarnya
          # sendiri secara otomatis. Tidak ada lagi langkah yang bisa dilupakan.
          #
          # Daftarnya dirakit langkah `meta` karena bergantung saluran (lihat
          # kepala berkas): tag git tidak menyentuh `:latest`.
          tags: ${{ steps.meta.outputs.tags }}
          # Cache antar-jalan: tanpa ini setiap build mengulang `bun install`
          # dan `prisma generate` dari nol.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: Sebutkan yang terdorong
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ══ Bundel luring — HANYA untuk tag `v*` ════════════════════════════════
  # Menunggu SEMUA image terbit (`needs: publish`), lalu menarik versi persis
  # itu dari registry dan menyimpannya. Daftar image dibaca dari compose oleh
  # skripnya, bukan ditulis di sini — lihat kepala `scripts/onprem-offline-bundle.sh`.
  offline-bundle:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rakit bundel luring
        run: sh scripts/onprem-offline-bundle.sh --tag "${GITHUB_REF_NAME#v}" --keluar dist-luring

      - name: Terbitkan sebagai aset GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Rilis yang sudah dibuat tangan (catatan rilis ditulis pemilik) tidak
        # ditimpa catatannya — asetnya saja yang diunggah.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-luring/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-luring/* \
              --verify-tag --title "SAI Accounting $GITHUB_REF_NAME" \
              --notes-file dist-luring/BACA.txt
          fi
