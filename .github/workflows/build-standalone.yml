# Build deploy bundle without Node on your server.
# Download artifact from Actions → upload to hosting.
name: Build standalone bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node TETAP dibutuhkan meski paket dipasang oleh bun: `next build`, `tsc`,
      # dan Prisma dijalankan Node lewat shebang binary-nya. Versinya harus
      # 20.19+ — Prisma 7 menolak yang lebih lama di skrip preinstall-nya.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Padanan `npm ci`: gagal bila bun.lock tidak sinkron dengan package.json.
        run: bun install --frozen-lockfile

      - name: Prisma generate
        # `bun run db:generate`, BUKAN `bunx prisma generate`.
        #
        # Repo ini punya TIGA skema Prisma sejak #104 (basis data perusahaan)
        # dan #137 (platform): `prisma/schema.prisma`, `prisma/control/`, dan
        # `prisma/platform/`. `bunx prisma generate` hanya membangkitkan yang
        # pertama, jadi `@/generated/control/client` dan
        # `@/generated/platform/client` tidak pernah ada — dan `next build`
        # gagal dengan "Module not found" pada `lib/control-db.ts` &
        # `lib/platform-db.ts`.
        #
        # Tidak terlihat di lokal karena `src/generated/` sudah terlanjur ada
        # di mesin siapa pun yang pernah menjalankan `bun run db:generate`
        # sekali; ia gitignored, jadi hanya CI yang memulai dari nol.
        run: bun run db:generate

      - name: Build standalone
        run: bun run package:standalone
        env:
          NODE_ENV: production
          # Placeholder for build; real secrets go in server .env
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          AUTH_SECRET: ci-build-placeholder-secret-min-32-chars
          AUTH_URL: https://example.com

      - name: Zip bundle
        run: |
          cd dist
          zip -r sai-standalone.zip sai-standalone

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sai-standalone
          path: dist/sai-standalone.zip
          retention-days: 14
